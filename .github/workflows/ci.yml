name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site settings
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: j178/prek-action@v3.1.0 # no floating major tag upstream
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:dist
      - run: bun run test:e2e
      # README screenshots are not a test: regenerate them on a manual run and keep the PNGs as an artifact
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bun run screenshots
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/
      - run: bun run test:base
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build for Pages
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && success() }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
