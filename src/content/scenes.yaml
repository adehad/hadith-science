# Scenes (phase 2 plan). Each caption note is our own paraphrase of the cited §.
- id: report
  division: adad-al-turuq
  moons: [0, 1]
  order: 1
  title: What is a report?
  eyebrow: How a report reached us, its parts and names · §5.2
  lede: A report reaches us as a chain of narrators leading to its words, the isnād and the matn. Before he counts chains, Ibn Ḥajar defines both, and sets out three ways scholars relate the names khabar and ḥadīth.
  source: §5.2 Khabar, ḥadīth, isnād and matn; §5.5 the Intentions report
  diagram: Report
  width: 860
  captions:
    - term: isnad
      note: "The isnād is an account of the path that leads to the matn. A report's ṭuruq, its routes, are its chains, and many chains is one of the conditions of mutawātir. The chain drawn here is the Intentions report: ʿAlqama alone from ʿUmar, Muḥammad ibn Ibrāhīm alone from ʿAlqama, and Yaḥyā ibn Saʿīd alone from him. Ibn Rushayd points out that it is the first report in al-Bukhārī's Ṣaḥīḥ (§5.2, §5.5)."
    - term: matn
      note: "The matn is the text in which the chain ends: the words themselves, which the chain leads to. Here it is the saying “actions are judged by intentions”, which ʿUmar narrated, and which ʿAlqama, Muḥammad ibn Ibrāhīm and Yaḥyā ibn Saʿīd passed on, one after another (§5.2, §5.5)."
    - term: khabar
      note: "For the scholars of this field, khabar means the same as ḥadīth. Some say ḥadīth is what comes from the Prophet ﷺ and khabar what comes from others; one who studies history and the like is called an akhbārī, and one who studies ḥadīth a muḥaddith. Others say every ḥadīth is a khabar, but not every khabar a ḥadīth. Ibn Ḥajar's text speaks of khabar because it covers more (§5.2)."
    - term: hadith
      note: "The other of the two names. Taken as a synonym, it means just what khabar means. On the view that sets them apart, ḥadīth is what comes from the Prophet ﷺ, and khabar what comes from anyone else. On the view that nests them, ḥadīth is the narrower name: every ḥadīth is a khabar, but not every khabar is a ḥadīth (§5.2)."
  views:
    - id: same
      label: One meaning
      scholars: The scholars of this field, §5.2
      note: "Khabar and ḥadīth are two names for one thing."
    - id: apart
      label: Two kinds
      scholars: "“It is said”, §5.2"
      note: "Ḥadīth is what comes from the Prophet ﷺ and khabar what comes from others. One who studies history and the like is called an akhbārī, and one who studies ḥadīth a muḥaddith."
    - id: nested
      label: General and particular
      scholars: "“It is said”, §5.2"
      note: "The two relate as general and particular: every ḥadīth is a khabar, but not every khabar is a ḥadīth. Ibn Ḥajar's text speaks of khabar because it covers more."
- id: routes
  division: adad-al-turuq
  moons: [0, 1]
  order: 2
  title: How many routes carry it?
  eyebrow: How a report reached us · §5.2–5.6
  lede: Reports are sorted by the fewest narrators found at any one generation of the chain.
  source: §5.3 Mutawātir, §5.4 Mashhūr, §5.5 ʿAzīz, §5.6 Gharīb
  diagram: Routes
  width: 820
  captions:
    - term: gharib
      note: "A single narrator alone carries it at some stage, and it does not matter where in the chain that happens; Ibn Ḥajar later splits it into absolute and relative gharīb. With mashhūr and ʿazīz it is one of the āḥād: reports that fall short of the conditions of mutawātir."
    - term: aziz
      note: "Never fewer than two at any stage: at least two narrate it from two. The name means either rare or strengthened, since a second route strengthens it. Being ʿazīz is not a condition for a sound (ṣaḥīḥ) report, against those who claimed it was."
    - term: mashhur
      note: "Carried by a limited number above two, so three or more at every stage, without meeting the conditions of mutawātir. It is named for being well known, and a group of jurists call it mustafīḍ. In common speech mashhūr also means any famous saying, even one with a single chain or none."
    - term: mutawatir
      note: "Carried at every stage by so many that, by experience, they could not have colluded on a lie or agreed on one by chance, and the last of them reports what was seen or heard. No fixed number is required. It gives certain knowledge (ʿilm yaqīnī), so its narrators are not investigated."
  panels:
    - { id: gharib, label: Gharīb, x0: 0, x1: 255 }
    - { id: aziz, label: ʿAzīz, x0: 255, x1: 425 }
    - { id: mashhur, label: Mashhūr, x0: 425, x1: 605 }
    - { id: mutawatir, label: Mutawātir, x0: 605, x1: 820 }
- id: sorting
  division: adad-al-turuq
  moons: [1]
  order: 3
  title: Which reports are acted on?
  eyebrow: How a report reached us, accepted or rejected · §5.3–5.7
  lede: Mutawātir is acted on without investigating its narrators, because its truth is certain. Every other report, the āḥād, is checked first. If its narrator is proven truthful it is accepted, and if proven untruthful it is rejected. If neither is proven it is held back, and treated like the rejected.
  source: §5.3 Mutawātir, §5.4 Mustafīḍ, §5.6–5.7 Āḥād, maqbūl and mardūd
  diagram: Sorting
  width: 780
  captions:
    - term: ahad
      note: "Every report except mutawātir: the mashhūr, ʿazīz and gharīb. Each one is also called khabar al-wāḥid, literally a report narrated by one person; as a term, it is any report that does not meet the conditions of mutawātir. Unlike mutawātir, its narrators' states must be investigated before it is used as proof, so it divides into the accepted and the rejected (§5.6–5.7)."
    - term: mustafid
      note: "A group of the jurists call the mashhūr mustafīḍ, named for its spreading out. Some tell the two apart: mustafīḍ is where the chain's beginning and end are equal, and mashhūr is more general than that. Others separate them on another basis, which Ibn Ḥajar says is not a question for this field. The dots in the inset are only an illustration; the book gives no example (§5.4)."
    - term: maqbul
      note: "An āḥād report that must be acted on, in the view of the majority. It has what makes for acceptance, its narrator's truthfulness being proven, so the report's truth is overwhelmingly likely. Mutawātir needs no such test: all of it is accepted, because the truth of the report is certain (§5.7)."
    - term: mardud
      note: "A report whose narrator's truthfulness is not established. When his untruthfulness is proven, the report's falsehood is overwhelmingly likely, and it is repelled. A report held back, with no proof either way, is treated like the rejected: not because a cause for rejection was found, but because a cause for acceptance was not (§5.7)."
  panels:
    - { id: kinds, label: Two kinds, x0: 0, x1: 260 }
    - { id: check, label: The check, x0: 260, x1: 520 }
    - { id: outcomes, label: Three outcomes, x0: 520, x1: 780 }
- id: knowledge
  division: adad-al-turuq
  moons: [0, 1]
  order: 4
  title: How sure can we be?
  eyebrow: How a report reached us, the knowledge it gives · §5.3, §5.7
  lede: Mutawātir gives certain knowledge, which even a layperson gains without reasoning. An āḥād report backed by signs can give reasoned knowledge, but only to a ḥadīth scholar versed in its narrators. With all three signs together it comes close to certainty.
  source: §5.3 Certain and reasoned knowledge, §5.7 Reports with supporting signs
  diagram: Knowledge
  width: 780
  captions:
    - term: ilm-yaqini
      note: "Mutawātir gives certain knowledge: a firm belief that matches the truth and compels a person to accept it, with no way to refute it. It comes without building evidence, so even a layperson, who cannot reason it out, gains it. Its narrators are not investigated: it must be acted on without that search (§5.3)."
    - term: ilm-nazari
      note: "Reasoned knowledge comes only by building evidence, ordering known or presumed facts to reach further ones, so only someone able to reason gains it. By the chosen opinion, an āḥād report backed by signs gives it, but only to a ḥadīth scholar versed in the narrators and hidden defects. Those who deny it keep the word knowledge for mutawātir: a dispute over words, Ibn Ḥajar says (§5.3, §5.7)."
    - term: muhtaff-bil-qarain
      note: "An āḥād report whose signs give reasoned knowledge. Ibn Ḥajar names three: being in both Ṣaḥīḥs, unless an expert criticised it or it is in an unresolved clash; a mashhūr with routes free of weak narrators and hidden defects; and a chain of great imams, not gharīb, as Aḥmad from al-Shāfiʿī from Mālik, the first two each with a partner. All three together come close to certainty (§5.7)."
  views:
    - id: ibn-hajar
      label: "Ibn Ḥajar: certain"
      scholars: §5.3
      note: "Mutawātir gives certain knowledge, which needs no building of evidence, so a layperson gains it too. Ibn Ḥajar calls this the trusted opinion."
    - id: nazari-only
      label: "Some: reasoned only"
      scholars: "“It has also been said”, §5.3"
      note: "An opinion the book reports without naming who holds it: mutawātir gives only reasoned knowledge. Ibn Ḥajar rejects it (“This is not so”): a layperson, who cannot order facts into an argument, still gains knowledge from mutawātir, which could not happen if that knowledge were reasoned."
  panels:
    - { id: certain, label: Certain, x0: 0, x1: 260 }
    - { id: meter, label: How sure, x0: 260, x1: 520 }
    - { id: signs, label: The signs, x0: 520, x1: 780 }
  extra:
    - title: Why the two Ṣaḥīḥs count as a sign
      section: §5.7
      note: "The standing of al-Bukhārī and Muslim in this field, their lead in telling the sound from the rest, and the scholars' acceptance of their books. That acceptance alone gives knowledge more strongly than many routes that fall short of mutawātir. It excludes reports an expert criticised, and two of their reports that clash with no way to prefer one; for the rest, the scholars agree on accepting them as sound. If it is said they agreed only to act on these reports, Ibn Ḥajar answers that acting on every sound report is agreed anyway, so the two books would then have nothing special. Abū Isḥāq al-Isfarāʾīnī, and among the ḥadīth imams al-Ḥumaydī and Abū al-Faḍl ibn Ṭāhir, said these reports give reasoned knowledge. Abū Manṣūr al-Baghdādī and Abū Bakr ibn Fūrak said the same of the clean mashhūr."
    - title: Why Mālik's presence counts
      section: §5.7
      note: "Anyone with the least knowledge of this field knows that when a narrator like Mālik takes part in a report, he is truthful in it; when another of his rank joins him, it grows stronger and the fear of a mistake recedes. The standing and qualities of such narrators make their chain equal to one carried by a large number of others."
- id: lone
  division: adad-al-turuq
  moons: [1]
  order: 5
  title: Where is the narrator alone?
  eyebrow: How a report reached us, absolute and relative gharīb · §5.8
  lede: A gharīb report has one narrator alone at some point in its chain. Where that happens decides its kind. If he is alone at the root, the Companion's end, it is absolute; if several narrate from the Companion and someone is alone further down, it is relative.
  source: §5.8 Gharīb and fard, absolute and relative; §5.5 the Intentions report
  diagram: Lone
  width: 1040
  captions:
    - term: gharib-mutlaq
      note: "The narrator is alone at the root of the chain, the Companion's end, where its routes meet. The book calls it fard muṭlaq. In the report forbidding the sale or gift of walāʾ, ʿAbd Allāh ibn Dīnār alone has it from Ibn ʿUmar. In the Branches of Faith report, Abū Ṣāliḥ alone has it from Abū Hurayra, and ʿAbd Allāh ibn Dīnār alone after him. At times it stays solitary all or most of the way (§5.8)."
    - term: fard
      note: "Fard and gharīb mean the same, in the language and as terms. In practice, as nouns, fard is used mostly for the absolute kind and gharīb mostly for the relative. As verbs they make no difference: of either kind it is said that so-and-so was alone with it (tafarrada bihi, aghraba bihi). Ibn Ḥajar compares this with how mursal and munqaṭiʿ are used (§5.8)."
    - term: gharib-nisbi
      note: "More than one narrator has it from the Companion, then one narrator is alone with it further down. It is called relative because the singularity is relative to one particular person, even if the ḥadīth itself is mashhūr. The book names it fard nisbī, but notes that the word fard is rarely used for this kind. It gives no example, so this column is only an illustration (§5.8)."
  panels:
    - { id: wala, label: Alone at the root, x0: 0, x1: 260 }
    - { id: branches, label: Alone, then alone again, x0: 260, x1: 520 }
    - { id: intentions, label: Alone link after link, x0: 520, x1: 780 }
    - { id: nisbi, label: Alone further down, x0: 780, x1: 1040 }
  extra:
    - title: The Intentions report
      section: §5.5
      note: "Some who hold that a sound report must be at least ʿazīz answer the case of the Intentions report this way: ʿUmar told it from the pulpit before the Companions, who would have questioned it had they not known it. Ibn Ḥajar replies that their silence proves nothing, and that even granting this for ʿUmar, it does not hold for what follows: ʿAlqama alone narrates it from ʿUmar, then Muḥammad ibn Ibrāhīm alone from ʿAlqama, then Yaḥyā ibn Saʿīd alone from Muḥammad, by the sound route the ḥadīth masters know. Supporting chains have appeared, but they cannot be counted. Ibn Rushayd adds that its place as the first report in al-Bukhārī's Ṣaḥīḥ is enough to refute the claim that being ʿazīz was al-Bukhārī's condition."
- id: causes
  division: al-mardud
  moons: [0, 1]
  order: 1
  title: Why is a report rejected?
  eyebrow: Rejected reports, the two grounds · §5.17, §5.21, §5.23
  lede: A report is rejected for one of two things. A narrator has dropped out of its chain, or a narrator in it is open to a charge. Ibn Ḥajar names ten charges, and lists them from the gravest down rather than sorting them by kind.
  source: §5.17 Saqṭ and ṭaʿn, §5.21 Plain and hidden drops, §5.23 The ten causes, §5.24–5.38 What each cause yields
  diagram: Causes
  width: 860
  captions:
    - term: saqt
      note: "A narrator missing from the chain: one of the two grounds for rejecting a report. The drop may be at the collector's end of the chain, by his own act; at the far end, after the Successor; or elsewhere. It may be plain to all, when the two never met, as records of birth, death, study and travel show; or hidden, found only by experts who know a ḥadīth's routes (§5.17, §5.21)."
    - term: tan
      note: "The other ground: a charge against a narrator, touching his religion or his accuracy. Five causes concern integrity and five accuracy, but Ibn Ḥajar doesn't sort them, so all ten run from the gravest down: lying about the Prophet ﷺ, being accused of it, gross errors, negligence, open sin, mistaken impressions, going against the reliable, being unknown, innovation and poor memory (§5.17, §5.23)."
  extra:
    - title: What each cause yields
      section: §5.24–5.38
      note: "Lying about the Prophet ﷺ makes a report mawḍūʿ, and being accused of lying makes it matrūk. Gross errors, negligence and open sin make it munkar, for those who don't require going against others. A mistaken impression found by close study and gathering the chains makes it muʿallal. Going against the reliable gives mudraj, maqlūb, al-mazīd, muḍṭarib, muṣaḥḥaf and muḥarraf. Being unknown covers the mubham, majhūl al-ʿayn and mastūr narrator. An innovator is accepted or not by the kind of his innovation. Poor memory for life is shādhdh, for some ḥadīth scholars; poor memory that comes on later is mukhtaliṭ."
- id: breaks
  division: al-mardud
  moons: [0]
  order: 2
  title: Where does the chain break?
  eyebrow: Rejected for a break in the chain · §5.18–5.20
  lede: All four lose narrators from the chain. What tells them apart is where the gap sits and how many links are missing one after another.
  source: §5.18 Muʿallaq, §5.19 Mursal, §5.20 Muʿḍal and Munqaṭiʿ
  diagram: Breaks
  width: 820
  captions:
    - term: mursal
      note: "The drop comes after the Successor: a Successor, senior or junior, says the Prophet ﷺ said or did something, or that it was done in his presence. It is rejected because the missing narrator is unknown. He may be a Companion or another Successor, and a Successor may be weak or sound, and may himself have heard it from yet another Successor."
    - term: muallaq
      note: "The collector drops one or more narrators at his own end of the chain and cites someone further up. At the extreme the whole chain goes and he simply says the Messenger of Allah ﷺ said it, or keeps only the Companion, or the Successor and the Companion. It is rejected because the dropped narrator is unknown, but it may be judged sound where the same report appears elsewhere with him named."
    - term: mudal
      note: "Two or more narrators dropped one after another. Ibn Ḥajar makes each term wider than the other in one respect. Muʿḍal is the more general on where the drops sit, and it meets muʿallaq when the run of drops is at the collector's end. Muʿallaq is tied to the collector's own act at that end, and needs only one drop (§5.18, §5.20)."
    - term: munqati
      note: "Narrators dropped, but not one after another: for example two drops in two separate places. A single drop on its own is also munqaṭiʿ. A run of two or more in a row would make it muʿḍal instead."
  views:
    - id: hadith-scholars
      label: Most hadith scholars
      scholars: §5.19
      note: "Even when a Successor is known to drop only trustworthy narrators, most hadith scholars pause (tawaqquf) on his mursal, because the doubt over who is missing remains. This is also one of Aḥmad's two opinions."
    - id: malikis
      label: Mālikīs, Kūfīs, Aḥmad (other opinion)
      scholars: §5.19
      note: "Aḥmad's other opinion, shared by the Mālikīs and the Kūfīs: the mursal of a Successor who drops only trustworthy narrators is accepted outright."
    - id: shafii
      label: al-Shāfiʿī
      scholars: §5.19
      note: "al-Shāfiʿī: when another report supports it, whether that one is connected or itself mursal, the balance tips to accepting it and taking the missing narrator to be trustworthy."
  panels:
    - { id: mursal, label: Mursal, x0: 0, x1: 215 }
    - { id: muallaq, label: Muʿallaq, x0: 215, x1: 415 }
    - { id: mudal, label: Muʿḍal, x0: 415, x1: 615 }
    - { id: munqati, label: Munqaṭiʿ, x0: 615, x1: 820 }
- id: hidden
  division: al-mardud
  moons: [0]
  order: 3
  title: Did he hear it from him?
  eyebrow: Rejected for a hidden drop · §5.21–5.22
  lede: Some drops are hidden. The narrator cites someone he could have heard from, in words that allow a meeting without claiming he heard. Whether the two are known to have met decides the name. It is tadlīs if they met, and a hidden mursal if they lived at the same time but no meeting is known.
  source: §5.21 Mudallas, §5.22 Mursal khafī
  diagram: Hidden
  width: 780
  captions:
    - term: mudallas
      note: "A hidden drop, found only by expert imams who know a ḥadīth's routes. The narrator does not name the one he heard it from, and cites someone above him in words of delivery that leave a meeting possible, such as ʿan (from) or qāla (he said). The name comes from dalas, the mixing of darkness: both involve concealment. In Ibn Ḥajar's usage, tadlīs is from someone he is known to have met (§5.21–5.22)."
    - term: mudallis
      note: "The narrator who conceals in this way. Had he used words of certainty for what he did not hear, he would be classed a liar. When it is proven that a reliable narrator has done this, his report is not accepted until he makes clear that he heard it, on the most correct opinion (§5.21)."
    - term: mursal-khafi
      note: "A narrator reports from a contemporary he is not known to have met, with someone missing between them. That they never met is known from the narrator's own word or a versed imam's firm statement. An extra narrator in some versions is not enough, since it may be an addition, so no firm ruling follows from it. al-Khaṭīb compiled a book on this (§5.22)."
  views:
    - id: ibn-hajar
      label: "Ibn Ḥajar: they met"
      scholars: §5.22; with al-Shāfiʿī, Abū Bakr al-Bazzār and al-Khaṭīb
      note: "Tadlīs is only from someone the narrator is known to have met. If they lived at the same time and no meeting is known, it is a hidden mursal. The two differ, and the correct opinion keeps them apart. Ibn Ḥajar calls requiring a meeting the trusted opinion."
    - id: contemporary
      label: "Some: living at the same time"
      scholars: "“Whoever has added”, §5.22"
      note: "Some add to the definition of tadlīs “being a contemporary even if they have not met”. That brings the hidden mursal inside tadlīs too. Ibn Ḥajar answers that the mukhaḍramūn would then be mudallis, yet the ḥadīth scholars agree that their reports from the Prophet ﷺ are irsāl."
  panels:
    - { id: met, label: They met, x0: 0, x1: 260 }
    - { id: never-met, label: Never known to meet, x0: 260, x1: 520 }
    - { id: test, label: Lived in his time, x0: 520, x1: 780 }
  extra:
    - title: The mukhaḍramūn
      section: §5.22
      note: "Ibn Ḥajar's evidence that tadlīs needs a known meeting, not just a shared lifetime. The people of knowledge in ḥadīth agree that the reports of the mukhaḍramūn, such as Abū ʿUthmān al-Nahdī and Qays ibn Abī Ḥāzim, from the Prophet ﷺ are irsāl, not tadlīs. They certainly lived in his time, but it is not known whether they met him. If living at the same time were enough for tadlīs, they would be mudallis. al-Shāfiʿī and Abū Bakr al-Bazzār also require a meeting, and al-Khaṭīb's al-Kifāya stipulates it. Ibn Ḥajar calls this the trusted opinion."
- id: lying
  division: al-mardud
  moons: [1]
  order: 4
  title: Did he lie?
  eyebrow: Rejected for lying · §5.23–5.25
  lede: The gravest charge is lying about the Prophet ﷺ, and a report from such a narrator is called fabricated. Next comes being suspected of lying, which makes a report abandoned. A forgery is judged on overwhelming evidence, not certainty, because even a liar sometimes tells the truth.
  source: §5.23 Kadhib and tuhma bi-l-kadhib, §5.24 Mawḍūʿ, §5.25 Matrūk
  diagram: Lying
  width: 780
  captions:
    - term: kadhib
      note: "The gravest of the ten causes of criticism, which the book sets out from the worst downwards: the narrator lies in a Prophetic report, deliberately narrating from the Prophet ﷺ what he did not say. Open sin is the wider charge, but lying is named on its own because in this field it is the graver charge. A report from such a narrator is the first kind of rejected report, mawḍūʿ (§5.23–5.24)."
    - term: tuhma-bil-kadhib
      note: "Suspicion of lying, less grave than lying itself. It arises when a ḥadīth is reported by him alone and goes against known principles, or when he is known to lie in his everyday speech, though no lie of his in Prophetic reports is proven. A report from such a narrator is the second kind of rejected report, matrūk (§5.23, §5.25)."
    - term: matruk
      note: "The second kind of rejected report, following the order of the ten causes: one whose narrator is accused of lying. The grounds of the accusation are those given among the causes: only he reports it and it goes against known principles, or he lies in everyday speech though no lie of his in ḥadīth is proven (§5.23, §5.25)."
    - term: mawdu
      note: "The first kind of rejected report: its narrator lied about the Prophet ﷺ. It is judged on overwhelming evidence, not certainty, since even a liar sometimes tells the truth, and only scholars of wide knowledge and insight can judge it. Signs include the forger's admission, the narrator's state at the time, and a text clashing past reconciling with the Qurʾan, mutawātir sunna, firm consensus or common sense (§5.24)."
  panels:
    - { id: charges, label: Two charges, x0: 0, x1: 260 }
    - { id: signs, label: How a forgery is known, x0: 260, x1: 520 }
    - { id: sources, label: Where it comes from, x0: 520, x1: 780 }
  extra:
    - title: Two forgers caught in the act
      section: §5.24
      note: "The narrator's state can give a forgery away. When the question of whether al-Ḥasan heard from Abū Hurayra came up before Maʾmūn ibn Aḥmad, he at once recited a chain to the Prophet ﷺ saying that he had. Ghiyāth ibn Ibrāhīm came in on al-Mahdī while he was playing with his pigeons, and at once recited a chain to the Prophet ﷺ allowing contests in archery, camel racing and horse racing, adding the words “and pigeon racing” himself. al-Mahdī knew he had lied for his sake, and ordered the pigeons killed."
    - title: A forger's confession
      section: §5.24
      note: "Sometimes a forgery is known from the forger's own admission. Ibn Daqīq al-ʿĪd said the confession is not taken as certain, since he may be lying in it. Some understood him to mean it is not acted on at all, but Ibn Ḥajar says he only denied certainty, and a ruling can rest on overwhelming evidence. Otherwise no one could be punished on a confession to murder or adultery, since they too might be lying."
    - title: Where forged words come from, and why
      section: §5.24
      note: "A forger may invent the words himself, or take the words of others, such as some of the pious predecessors, the ancient sages or biblical sources, or take a report with a weak chain and invent a sound chain for it so that it spreads. Forgers act from an absence of religion, like the zindīqs; from ignorance, like some worshippers; from loyalty to a school; to please leaders; or to win fame with something rare. All of it is forbidden by consensus. Some of the Karrāmiyya and Ṣūfīs are reported to allow lying to encourage good and warn against evil; Ibn Ḥajar calls this a mistake born of ignorance, since that too is part of the Law. Deliberately lying about the Prophet ﷺ is a major sin, and al-Juwaynī went so far as to call the deliberate forger a disbeliever. Narrating a forged report is forbidden unless one makes its forgery clear, as Muslim's report from the Prophet ﷺ warns."
- id: slips
  division: al-mardud
  moons: [1]
  order: 5
  title: Did he keep it right?
  eyebrow: Rejected for mistakes · §5.23, §5.26–5.27, §5.38
  lede: Some charges are about how well a narrator keeps what he reports. He may make many glaring mistakes, be careless, or report on a mistaken impression that only gathering the routes will show. His memory may be poor all his life, or fail later, so that what he told before is accepted only when it can be told apart.
  source: §5.23 Fuḥsh al-ghalaṭ, ghafla and wahm, §5.26 Munkar, §5.27 Muʿallal, §5.38 Sūʾ al-ḥifẓ and mukhtaliṭ
  diagram: Slips
  width: 780
  captions:
    - term: fuhsh-al-ghalat
      note: "The third of the ten causes of criticism: the narrator's mistakes are gross, which means many. For those who do not make going against others a condition of munkar, his report is munkar, and so are the reports of the fourth and the fifth: the one whose carelessness is excessive and the one whose sin is open (§5.23, §5.26)."
    - term: ghafla
      note: "The fourth cause: a naive carelessness about accuracy in what he passes on. When it is excessive, his report is munkar for those who do not make going against others a condition of munkar (§5.23, §5.26)."
    - term: wahm
      note: "The sixth cause: the narrator reports on a mistaken impression. When indications reveal it, such as joining up a mursal or broken chain, or slipping one ḥadīth into another, found by close study and gathering the routes, the report is muʿallal. Ibn Ḥajar names this one because it needs the longest explanation (§5.23, §5.27)."
    - term: muallal
      note: "A report whose hidden mistake shows only by close study and gathering its routes, one of the subtlest kinds. Only a few with keen understanding, vast memory and full knowledge of narrators' ranks, chains and texts have spoken on it, such as ʿAlī ibn al-Madīnī, Aḥmad, al-Bukhārī, Abū Zurʿa and al-Dāraquṭnī. Like a money-changer judging false coins, the expert may not always show his proof (§5.27)."
    - term: su-al-hifz
      note: "The tenth cause: the narrator's mistakes outweigh what he gets right. It is of two kinds. If it stays with him in every state, some ḥadīth scholars call his report shādhdh. If it comes on him later, he is mukhtaliṭ (§5.23, §5.38)."
    - term: mukhtalit
      note: "Poor memory that came on later: through old age, the loss of his sight, or the burning or loss of the books he relied on, so that he fell back on a memory that had weakened. What he narrated before is accepted when it can be told apart; what cannot is held back, as is any case that can't be settled. Only a study of those who took from him shows which is which (§5.38)."
  panels:
    - { id: errors, label: Errors and carelessness, x0: 0, x1: 260 }
    - { id: defect, label: A hidden defect, x0: 260, x1: 520 }
    - { id: memory, label: Poor memory, x0: 520, x1: 780 }
  extra:
    - title: The hidden-defect picture
      section: §5.27
      note: "The book gives no example of a muʿallal report, so the middle panel is an illustration. One unnamed chain runs from the Prophet ﷺ through a Companion and a Successor, which looks connected. Gathering the other routes shows each of them going from the Successor straight to the Prophet ﷺ, with no Companion between: the narrator has joined up a mursal, one of the indications §5.27 names. The book names two more of the few who spoke on it, whose names in the translation are under query; they are left out of the panel until a ruling."
- id: changes
  division: al-mardud
  moons: [1]
  order: 6
  title: What changed in the telling?
  eyebrow: Rejected for going against the reliable · §5.28–5.32
  lede: The seventh charge is going against reliable narrators, and what the narrator changed gives the report its name. He may run chains or words together, put names or words the wrong way round, add a narrator, change a narrator with no way to choose between the versions, or change letters while the word keeps its outline.
  source: §5.23 Mukhālafa, §5.28 Mudraj, §5.29 Maqlūb, §5.30 al-Mazīd fī muttaṣil al-asānīd, §5.31 Muḍṭarib, §5.32 Muṣaḥḥaf and muḥarraf
  diagram: Changes
  width: 860
  captions:
    - term: mukhalafa
      note: "The seventh cause of criticism: the narrator goes against the reliable narrators. What he changed names the report: how a chain is put together, or words slipped into a text (mudraj); one thing put before another (maqlūb); an added narrator (al-mazīd); a narrator changed, with no way to choose (muḍṭarib); or letters changed, the outline kept (muṣaḥḥaf, muḥarraf) (§5.23, §5.28–5.32)."
    - term: mudraj
      note: "Going against the reliable by changing how a chain is put together, or by slipping into a text words not part of it, without saying so. An insertion is known from a fuller version setting it apart, from a statement by the narrator or a versed imam, or because the Prophet ﷺ could not have said it. al-Khaṭīb wrote a book on it, which Ibn Ḥajar summarised and added to, twice over or more (§5.28)."
    - term: mudraj-al-isnad
      note: "Four kinds. Several chains of one ḥadīth are merged into one without saying so. Part of a text held through another chain is told with the first, or a part heard indirectly is told without the go-between. Two texts with two chains are told with one, or one gets words from the other. Or a narrator reads a chain, is distracted and speaks for himself, which a listener takes as its text (§5.28)."
    - term: mudraj-al-matn
      note: "Words that are not part of a text come into it: at its start, in its middle, or, most often, at its end, by joining one sentence to the next. Or the words of a Companion, or of someone after him, are merged into the words of the Prophet ﷺ without making that clear (§5.28)."
    - term: maqlub
      note: "Going against the reliable by putting first what comes later. In names: Murra ibn Kaʿb given as Kaʿb ibn Murra, since one's name is the other's father's; al-Khaṭīb's Rāfiʿ al-irtiyāb is on this. In a text: in Abū Hurayra's report in Muslim of the seven whom Allah will shade, a narrator mixed up the hands; in the two Ṣaḥīḥs, the left hand does not know what the right has spent (§5.29)."
    - term: mazid
      note: "Going against the reliable by adding a narrator inside a chain, when the version without him is more reliable. Its condition is that hearing is stated plainly at the place of the addition. If it is not, if that link is told with ʿan, for example, the version with the addition is preferred (§5.30)."
    - term: mudtarib
      note: "Versions change a narrator, and there is no way to prefer one. It is usually in the chain and sometimes in the text, though a ḥadīth master rarely calls a report muḍṭarib for its text alone. A change made on purpose to test someone, as with al-Bukhārī and al-ʿUqaylī, is allowed if it is not left standing; made for rarity, it is a kind of forgery; made by mistake, it is maqlūb or muʿallal (§5.31)."
    - term: musahhaf
      note: "Going against the reliable by changing a letter or letters while the word keeps its outline: if the change is in the dots, it is muṣaḥḥaf. Knowing it matters; al-ʿAskarī, al-Dāraquṭnī and others compiled books on it. It is most often in the text, and sometimes in the names in the chains (§5.32)."
    - term: muharraf
      note: "The same kind of change, a letter or letters changed while the word keeps its outline, but in its vowelling rather than its dots. Like muṣaḥḥaf, it is most often in the text and sometimes in the names in the chains (§5.32)."
  extra:
    - title: The illustrations
      section: §5.28–5.32
      note: "The book gives examples only for maqlūb: Murra ibn Kaʿb, and the hands in Abū Hurayra's report. For mudraj, al-mazīd, muḍṭarib, muṣaḥḥaf and muḥarraf it names none, so those cells are illustrations: unnamed chains, blank text cards and single letter shapes, not real reports. One undotted letter outline is read as different letters by the dots below or above it, and is voiced differently by a fatḥa, ḍamma or kasra."
- id: wording
  division: al-mardud
  moons: [1]
  order: 7
  title: May the words be changed?
  eyebrow: Changing the words on purpose, and rare words · §5.33–5.34
  lede: On the correct opinion, a report's words may be changed on purpose, by cutting it short or putting it in other words, only by a scholar who knows how words carry meaning. Even then the exact words are better. Where a word is rare, the books on rare words explain it.
  source: §5.33 Ikhtiṣār al-ḥadīth and al-riwāya bi-l-maʿnā, §5.34 Gharīb al-ḥadīth
  diagram: Wording
  width: 780
  captions:
    - term: ikhtisar-al-hadith
      note: "Cutting part of a report. On the correct opinion, only a scholar who knows what words signify may change a text on purpose; most allow shortening on that condition. The expert drops only what has no tie to the rest, so the meaning holds and the two parts stand like two reports, or the kept part points to the dropped one. One who does not know may drop what matters, such as an exception (§5.33)."
    - term: riwaya-bil-mana
      note: "Telling a report in other words of the same meaning. The dispute is well known; most allow it to a scholar who knows how words carry meaning. Their strongest proof: all agree an expert may put the Law into another language, so other Arabic words are allowed all the more. Still, the exact words are without doubt better; al-Qāḍī ʿIyāḍ wished the practice would stop (§5.33)."
    - term: gharib-al-hadith
      note: "When a word is unclear because it is rare, the books on rare words explain it: Abū ʿUbayd al-Qāsim ibn Sallām's, unarranged until Ibn Qudāma put it in letter order; Abū ʿUbayd al-Harawī's, the most complete; al-Zamakhsharī's al-Fāʾiq; and Ibn al-Athīr's al-Nihāya, the easiest to consult. A common word in a special sense needs the books on the meanings of reports and on difficult reports (§5.34)."
  views:
    - id: most
      label: Most scholars
      scholars: Most scholars, and Ibn Ḥajar, §5.33
      note: "Most scholars allow it; on the correct opinion, Ibn Ḥajar says, only a scholar who knows how words carry meaning may do it. Their strongest proof: all agree an expert may put the Law into another language, so other Arabic words are allowed all the more."
    - id: single-words
      label: "Some: single words only"
      scholars: "“It is said”, §5.33"
      note: "Some, whom the book doesn't name, allow it for single words, not for whole sentences."
    - id: knows-wording
      label: "Some: if he knows the words"
      scholars: "“It is also said”, §5.33"
      note: "Others, again unnamed, allow it to one who knows the original words, so that he can go back to them."
    - id: forgot
      label: "Some: if he has forgotten them"
      scholars: "“It is said”, §5.33"
      note: "Others, again unnamed, allow it only to one who memorised the report and then forgot its words while its meaning stayed firm in his mind. He may tell it by meaning to state a ruling, unlike one who still knows its wording."
  panels:
    - { id: shortening, label: Cutting it short, x0: 0, x1: 260 }
    - { id: by-meaning, label: In other words, x0: 260, x1: 520 }
    - { id: rare, label: Rare words, x0: 520, x1: 780 }
- id: identity
  division: al-mardud
  moons: [1]
  order: 8
  title: Why is he unknown?
  eyebrow: Rejected for a narrator who is unknown, the causes · §5.35
  lede: The eighth charge is that a narrator is unknown, and Ibn Ḥajar gives two causes. A man with many names, cited by one he is not known by, is taken for someone else; and a man who narrates rarely has few who take from him.
  source: §5.35 Jahāla and al-wuḥdān, §5.36 Majhūl al-ʿayn and mastūr
  diagram: Identity
  width: 860
  captions:
    - term: jahala
      note: "The eighth cause of criticism: the narrator's state is unknown. One cause: he has many references, such as name, lineage, title, occupation, description or ancestry; known by one, he is cited by another and taken for someone else. Muḥammad ibn al-Sāʾib ibn Bishr al-Kalbī was also called Muḥammad ibn Bishr, Ḥammād ibn al-Sāʾib, Abū al-Naḍr, Abū Saʿīd and Abū Hishām, and taken for a group (§5.35)."
    - term: wuhdan
      note: "The other cause of being unknown: the narrator narrates rarely, so few take from him. Scholars compiled books of al-wuḥdān: narrators from whom only one person narrates, even when he is named. Muslim and al-Ḥasan ibn Sufyān were among those who compiled them. Who narrates from him then sets which kind of unknown he is (§5.35–5.36)."
  extra:
    - title: Books on men with many names
      section: §5.35
      note: "Scholars have written on narrators with many names. al-Khaṭīb al-Baghdādī did it excellently in al-Mūḍiḥ, and before him ʿAbd al-Ghanī and then al-Ṣūrī wrote on it. One who does not know that the names belong to one man will not notice it."
    - title: The illustration
      section: §5.35
      note: "The book gives an example only for many names: al-Kalbī. It names no narrator with a single student, so the second cell is an illustration: unnamed figures, one narrator with a single student and, beside him for contrast, one with many. The kinds of unknown narrator that follow, majhūl al-ʿayn and mastūr, are drawn in Who is this narrator?"
- id: unknown
  division: al-mardud
  moons: [1]
  order: 9
  title: Who is this narrator?
  eyebrow: Rejected for doubt about a narrator · §5.35–5.36
  lede: Both chains are unbroken, but in each one narrator cannot be checked. One is never named; the other is named, but too little is known of him.
  source: §5.35 Jahāla, §5.36 Mubham
  diagram: Unknown
  width: 820
  captions:
    - term: mubham
      note: "The one reporting from him leaves him unnamed: “a man told me”, “the shaykh told me”, “the son of so-and-so”. Another chain that names him identifies him; until then the report is not accepted, since an unnamed man’s reliability cannot be known. On the soundest view, that holds even when he is called reliable, as in “a trustworthy man told me”: he may be trustworthy to that narrator but not to others (§5.36)."
    - term: majhul
      note: "He is named, but too little is known of him. Ibn Ḥajar gives two causes: he goes by several names, titles or lineages and, cited by an unfamiliar one, is taken for someone else; or he narrates so rarely that few take from him (§5.35). Who narrates from him then sets which kind he is: majhūl al-ʿayn or mastūr (§5.36)."
    - term: majhul-al-ayn
      note: "He is named, but only one narrator reports from him. Like the unnamed narrator, he is not accepted unless someone other than that one narrator vouches for him; Ibn Ḥajar calls this the soundest view. He adds that he is accepted, too, when that sole narrator is himself qualified to judge him (§5.36)."
    - term: mastur
      note: "Two or more narrate from him, but no one has vouched for him; also called majhūl al-ḥāl. A group accepted his reports outright, but the majority did not. Ibn Ḥajar neither accepts nor rejects: the report is held back until his state is clear, as Imām al-Ḥaramayn held (§5.36)."
  panels:
    - { id: mubham, label: Mubham, x0: 0, x1: 480 }
    - { id: majhul, label: Majhūl, x0: 480, x1: 820 }
- id: innovation
  division: al-mardud
  moons: [1]
  order: 10
  title: Does his belief count against him?
  eyebrow: Rejected for open sin, and sometimes for innovation · §5.23, §5.37
  lede: Open sin in deeds or words is the fifth charge. Innovation is the ninth, a belief against what is established from the Prophet ﷺ, held through a misreading rather than out of defiance. Whether an innovator's report is accepted depends on how far his belief goes, on whether he calls others to it, and on what he narrates.
  source: §5.23 Fisq, §5.37 Bidʿa
  diagram: Innovation
  width: 780
  captions:
    - term: fisq
      note: "The fifth cause of criticism: open sin, in deeds or words, that does not reach disbelief. Lying is a kind of it, but is listed on its own, and first, because it harms this field the most. For those who don't make going against others a condition of munkar, the report of one whose sin is plain is munkar. Sin in belief is explained later, as innovation (§5.23, §5.26)."
    - term: bida
      note: "The ninth cause: a belief against what is established from the Prophet ﷺ, held through a misreading, not out of defiance. If it amounts to disbelief, Ibn Ḥajar rejects only one who denies a mutawātir matter known for certain, or holds its opposite. If not, the most correct view accepts him unless he calls others to it, and the majority reject what he narrates in support of it (§5.23, §5.37)."
  views:
    - id: ibn-hajar
      label: Ibn Ḥajar
      scholars: Ibn Ḥajar, §5.37
      note: "If the belief amounts to disbelief, the trusted opinion, he says, rejects only one who denies a mutawātir matter known for certain in the religion, or holds its opposite; one who is careful in what he reports, and pious, is accepted. If it falls short of disbelief, he is accepted unless he calls others to it (the most correct view) or narrates what supports it (the preferred view of the majority)."
    - id: unless-lying
      label: Unless he allows lying
      scholars: "“It is said”, of both kinds, §5.37"
      note: "Some, whom the book doesn't name, accept an innovator of either kind unless he holds that lying is allowed in support of his view. The book reports this once for each kind."
    - id: reject
      label: Reject
      scholars: "The majority, of the first kind; “It is said”, of the second, §5.37"
      note: "This view joins two positions the book reports apart. The majority do not accept one whose belief amounts to disbelief. Only some, again unnamed, reject the second kind outright too, and Ibn Ḥajar calls that far-fetched."
  panels:
    - { id: sin, label: Open sin, x0: 0, x1: 260 }
    - { id: disbelief, label: Amounts to disbelief, x0: 260, x1: 520 }
    - { id: short, label: Short of disbelief, x0: 520, x1: 780 }
  extra:
    - title: The other opinions
      section: §5.37
      note: "On belief that amounts to disbelief, the majority do not accept him; it is also said he is accepted outright, and it is said he is accepted if he does not hold lying allowed in support of his view. Ibn Ḥajar answers that not every such report is rejected: every sect claims its opponents are heretics, and some call them disbelievers, so taken generally that would make every sect disbelievers. On belief short of disbelief, it is said he is rejected outright, which Ibn Ḥajar calls far-fetched: the usual reason, that narrating from him promotes his belief, would reject even a report that one who is no innovator shares. It is also said he is accepted unless he holds lying allowed, and it is said he is accepted if he does not call others to it, the most correct view. Ibn Ḥibbān went too far in claiming that all agree to accept one who does not call to it, without further detail."
    - title: al-Jūzajānī
      section: §5.37
      note: "Most accept an innovator who does not call others to his belief, but if he narrates what strengthens it, the preferred view of the majority rejects it. al-Jūzajānī, the shaykh of Abū Dāwūd, made this clear: describing a narrator who turns away from the truth, he said that if such a man is truthful and his ḥadīth is not munkar, nothing stops us accepting it, so long as he does not openly call to his belief. Ibn Ḥajar calls this strong: an innovator's report is rejected when its text seems to support his belief, even if he does not call to it openly."
- id: elevation
  division: lataif-al-isnad
  moons: [0]
  order: 1
  title: How near is the chain?
  eyebrow: Features of the chain, elevation and descent · §5.45, §5.47
  lede: A chain with fewer narrators than another route of the same ḥadīth is elevated; one with more is descended. Every narrator might slip, so fewer links mean fewer chances of error, and scholars sought elevation keenly. It is counted either to the Prophet ﷺ or to a great imam.
  source: §5.45 ʿUluww, absolute and relative; §5.47 Nuzūl
  diagram: Elevation
  width: 780
  captions:
    - term: uluww
      note: "A chain is elevated when its narrators are fewer than in another chain of the same ḥadīth. The early scholars sought it so hard that it kept some from weightier matters. It is sought because it is nearer to soundness and to fewer mistakes: every narrator in a chain might err, so the longer the chain the more room for error, and the shorter the less (§5.45)."
    - term: uluww-mutlaq
      note: "Absolute elevation: the shorter chain reaches the Prophet ﷺ himself with fewer narrators than another chain of the same ḥadīth. If that short chain is also sound, it is the most desired of all. If it is not, it still has the form of elevation, so long as it is not forged, since a forged chain is as if it did not exist (§5.45)."
    - term: uluww-nisbi
      note: "Relative elevation: the narrators are fewer up to one of the great imams of ḥadīth, men known for memory, accuracy and writings, such as Shuʿba, Mālik, al-Thawrī, al-Shāfiʿī, al-Bukhārī and Muslim, even if the chain from that imam to its end is long. Muwāfaqa, badal, musāwāh and muṣāfaḥa are kinds of it (§5.45–5.47)."
    - term: nuzul
      note: "Descent, the opposite of elevation: more narrators in the chain. Each kind of elevation has its own opposite kind of descent, against those who think it has none. A descended chain is the better one when it has what the elevated lacks: more authoritative men, sharper memory, more learning in law, or a plainer connection (§5.45, §5.47)."
  views:
    - id: ibn-hajar
      label: "Ibn Ḥajar: the weightier chain"
      scholars: §5.45
      note: "Elevation is sought because it is nearer to soundness. But when a longer chain has something the shorter lacks, such as more authoritative narrators, sharper memory, more learning in law or a plainer connection, there is no hesitation in calling the longer better."
    - id: reward
      label: "Some: always the longer"
      scholars: Those who prefer it, §5.45
      note: "Some prefer the longer chain in general, since studying more narrators takes more toil and so earns more reward. Ibn Ḥajar answers that this prefers it for a reason foreign to the matter, with no bearing on whether the ḥadīth is sound or weak."
  panels:
    - { id: absolute, label: Nearer the Prophet ﷺ, x0: 0, x1: 260 }
    - { id: relative, label: Nearer a great imam, x0: 260, x1: 520 }
    - { id: better, label: Is shorter always better?, x0: 520, x1: 780 }
- id: meeting
  division: lataif-al-isnad
  moons: [0]
  order: 2
  title: Where does our route meet theirs?
  eyebrow: Features of the chain, kinds of relative elevation · §5.46–5.47
  lede: A later narrator compares his own route with a great compiler's. He may reach the compiler's shaykh, or that shaykh's shaykh, without passing through the compiler; or his count of narrators may equal the compiler's, or the compiler's student's.
  source: §5.46 Muwāfaqa and badal, §5.47 Musāwāh and muṣāfaḥa
  diagram: Meeting
  width: 860
  captions:
    - term: muwafaqa
      note: "A kind of relative elevation: reaching a compiler's shaykh by a route that does not pass through the compiler. al-Bukhārī reports a ḥadīth from Qutayba from Mālik. Through al-Bukhārī there are eight between us and Qutayba; through Abū al-ʿAbbās al-Sarrāj from Qutayba, seven. So we meet al-Bukhārī at his own shaykh, by a shorter route (§5.46)."
    - term: badal
      note: "Also a kind of relative elevation: reaching the shaykh of the compiler's shaykh in the same way. In the book's example the same chain comes by another route to al-Qaʿnabī from Mālik, so al-Qaʿnabī stands in Qutayba's place. Both names are mostly used when the route is also shorter, but are used without that too (§5.46)."
    - term: musawah
      note: "A kind of relative elevation: the count of narrators from us to the end of our chain equals that in a compiler's chain. al-Nasāʾī reports a ḥadīth with eleven people between him and the Prophet ﷺ; the same ḥadīth reaches us by another chain with eleven between us and him. So we equal al-Nasāʾī in number, by a chain that is not his (§5.47)."
    - term: musafaha
      note: "A kind of relative elevation: our count equals that of the compiler's student. It is named after the handshake that two people usually exchange when they meet: in this form we have all but met al-Nasāʾī, so it is as if we had shaken his hand (§5.47)."
- id: peers
  division: lataif-al-isnad
  moons: [1]
  order: 3
  title: Who narrates from whom?
  eyebrow: Features of the chain, who narrates from whom · §5.48–5.50
  lede: Usually a younger man narrates from an older one. But peers narrate from each other, sometimes both ways; a senior may narrate from a junior; and a son may narrate from his father and grandfather, generation after generation.
  source: §5.48 Aqrān and mudabbaj, §5.49 Seniors from juniors, §5.50 Sons from fathers
  diagram: Peers
  width: 1040
  captions:
    - term: aqran
      note: "A narrator reports from someone like himself in a matter of narration, such as age, or taking from the same shaykhs. It is named after the aqrān, peers, because the narrator is his like. Abū al-Shaykh al-Iṣbahānī wrote a book on it (§5.48)."
    - term: mudabbaj
      note: "Each of two peers reports from the other. Every mudabbaj is a peers' narration, but not the reverse. When a shaykh and his student report from each other, it is debated; apparently it is not mudabbaj but seniors from juniors, since the name comes from the two cheeks of the face, alike on both sides. al-Dāraquṭnī wrote a book on it (§5.48)."
    - term: akabir-an-asaghir
      note: "A narrator reports from someone below him: younger, lower in rank, or one who met fewer shaykhs, or met them later. It includes fathers from sons, Companions from Successors and a shaykh from his student. The reverse is common, being the usual way. Knowing it tells the ranks apart and puts people in their place. al-Khaṭīb wrote on fathers from sons and on Companions from Successors (§5.49)."
    - term: abna-an-aba
      note: "The opposite case: a narrator reports from his father, from his grandfather. al-ʿAlāʾī compiled a large volume on those who did so up to the Prophet ﷺ, sorting them by whether “his” in “from his grandfather” is the narrator or his father. Ibn Ḥajar summarised it and added many more. The longest run from father to son he found was fourteen fathers (§5.50)."
  panels:
    - { id: peers, label: Peers, x0: 0, x1: 260 }
    - { id: mutual, label: Each from the other, x0: 260, x1: 520 }
    - { id: seniors, label: Senior from junior, x0: 520, x1: 780 }
    - { id: fathers, label: Son from father, x0: 780, x1: 1040 }
- id: doubts
  division: lataif-al-isnad
  moons: [2]
  order: 5
  title: Does the doubt harm it?
  eyebrow: Features of the chain, doubts about the shaykh · §5.52–5.53
  lede: Two doubts can touch the link between a narrator and his shaykh. The shaykh's name may fit two men, or the shaykh himself may deny the report. Whether the report survives depends on the men, and on what exactly the shaykh says.
  source: §5.52 Muhmal, §5.53 Man ḥaddatha wa-nasiya
  diagram: Doubts
  width: 780
  captions:
    - term: muhmal
      note: "A narrator reports from two men who share a name, a father's or grandfather's name, or a nisba, and nothing tells them apart. If both are reliable, it does no harm. al-Bukhārī reports from an “Aḥmad”, with no more said, from Ibn Wahb: Aḥmad ibn Ṣāliḥ or Aḥmad ibn ʿĪsā. When the two can't be told apart, scholars turn to outside signs and the weight of evidence (§5.52)."
    - term: man-haddatha-wa-nasiya
      note: "A shaykh denies a report passed on from him. If he denies it outright, saying he lied or that he did not report it, one of the two has lied, though we can't say which; the report is rejected, but neither man is discredited by it. If he says only that he does not remember it, the report is accepted on the most correct opinion, since he may have forgotten (§5.53)."
  views:
    - id: most-correct
      label: "Ibn Ḥajar: accepted"
      scholars: The most correct opinion, §5.53
      note: "When the shaykh says only that he does not remember, the report is accepted, since he may have forgotten. The student's trustworthiness means he is truthful, and the shaykh's not knowing does not cancel that: affirming comes before denying. al-Dāraquṭnī's book on those who narrated and forgot supports this."
    - id: not-accepted
      label: "Some: not accepted"
      scholars: "“It is also said”, §5.53"
      note: "Some say it is not accepted: the student is the periphery and the shaykh the core, and as the periphery follows the core in affirming a report, so it should in denying it, as with a witness to a witness. Ibn Ḥajar answers that the cases differ: a witness's witness is not heard when the first witness can testify, while narration is."
  panels:
    - { id: muhmal, label: One name, two men, x0: 0, x1: 260 }
    - { id: denied, label: He denies it, x0: 260, x1: 520 }
    - { id: forgot, label: He does not recall, x0: 520, x1: 780 }
  extra:
    - title: The Suhayl case
      section: §5.53
      note: "al-Dāraquṭnī wrote a book on those who narrated and forgot, with many cases that support accepting the report: narrators who no longer recalled a ḥadīth, and came to narrate it from those they had told it to. So Suhayl ibn Abī Ṣāliḥ had a report from his father, from Abū Hurayra, in the story of the testimony and the oath. al-Darāwardī heard it from Rabīʿa, from Suhayl; when he asked Suhayl, Suhayl did not know it, and was told that Rabīʿa had it from him. Afterwards Suhayl would say that Rabīʿa informed him that he had told it to him, from his father."
- id: delivery
  division: siyagh-al-ada
  moons: [0, 1, 2]
  order: 1
  title: How was it received?
  eyebrow: How it was passed on · §5.55–5.58
  lede: Ibn Ḥajar ranks, in eight stages, the words a narrator uses to say how he received a report. Higher steps mean closer, surer contact with the teacher; the arrow under each step thins and breaks up as that contact grows less certain. Below the stairs are weaker ways of receiving, most of which count only with the teacher's permission.
  source: §5.55 Ṣiyagh al-adāʾ, §5.56 Muʿanʿan, §5.57 Wijāda and waṣiyya, §5.58 Iʿlām
  diagram: Delivery
  width: 860
  captions:
    - term: samitu
      note: "First rank, with ḥaddathanā: both suit a narrator who heard the teacher's own words while alone with him. Samiʿtu is the clearer of the two, since it leaves no room for someone in between, while ḥaddathanā is sometimes used, with concealment (tadlīs), for a mere permission. Said in the plural (samiʿnā, ḥaddathanā) it shows others were there; only rarely is the plural one of respect."
    - term: haddathana
      note: "First rank, with samiʿtu. Keeping taḥdīth for what is heard from the teacher's own words is a well-known usage among hadith scholars, though in the language taḥdīth and ikhbār mean the same. The distinction comes from the eastern scholars and those who follow them; most western scholars treat ḥaddathanā and akhbaranā alike."
    - term: akhbarana
      note: "Second rank, with qaraʾtu ʿalayhi: the narrator read to the teacher himself. For the majority, reading to the teacher is a sound way of receiving reports. Some in Iraq denied it, and Ibn Ḥajar calls them far from right; Mālik and other scholars of Madīna fiercely refuted them."
    - term: qaratu-alayhi
      note: "Second rank: he read to the teacher himself. When that is what happened, saying qaraʾtu ʿalayhi is better than akhbaranā, because it shows more exactly what took place."
    - term: quria-alayhi
      note: "Third rank: someone else read to the teacher while the narrator listened. Where a reading is reported in the plural, as akhbaranā or qaraʾnā, it is treated like this rank."
    - term: anbaana
      note: "Fourth rank. For the earlier scholars inbāʾ means the same as ikhbār, both in the language and as a term; the later scholars use it for permission (ijāza), as they do ʿan."
    - term: nawalana
      note: "Fifth rank (munāwala): the teacher gives the student his original manuscript or a checked copy of it, or the student is shown the teacher's own original, and he says ‘these are my narrations from so-and-so, so narrate them from me’. With that permission, and with the student keeping the copy, it is the highest form of ijāza. Without permission most scholars do not count it."
    - term: shafahani
      note: "Sixth rank: permission (ijāza) given by word of mouth. Scholars call such spoken licensing mushāfaha."
    - term: kataba-ilayya
      note: "Seventh rank: permission (ijāza) given in writing, which the later scholars call mukātaba (correspondence). The earlier scholars kept the word for a teacher writing out hadith for his student, whether or not he also gave permission, and not for a letter carrying permission alone."
    - term: an
      note: "Eighth rank, with qāla, dhakara and rawā: words that could mean he heard it, had permission, or did not hear it at all. A chain joined by ʿan (muʿanʿan) counts as heard when the two lived at the same time, but not from a concealer (mudallis); the chosen view, with ʿAlī ibn al-Madīnī and al-Bukhārī, also asks for proof that they met at least once (§5.56)."
    - term: imla
      note: "Dictation: the teacher narrates from memory while the students write. Ibn Ḥajar puts hearing by dictation highest of all, because it brings added accuracy and memorisation."
    - term: wijada
      note: "He finds reports in the handwriting of a scholar he knows and says ‘I found in the handwriting of so-and-so’. Finding them does not let him say ‘so-and-so informed me’ (akhbaranā) unless he also has permission; some did say it, and erred (§5.57)."
    - term: wasiyya
      note: "The teacher bequeaths a book, or books, to a particular person, at his death or as he sets out on a journey. A group of the earlier imams allowed narrating on the bequest alone; the majority allow it only with permission as well (§5.57)."
    - term: ilam
      note: "The teacher simply tells a student that he narrates a certain book from a certain person. With permission it counts; without it, it does not (§5.58)."
    - term: ijaza-amma
      note: "Permission given at large: ‘to all Muslims’, ‘to everyone alive in my time’, or to the people of a region or land, the last nearest to correct as the most restricted. Ibn Ḥajar does not count it, though al-Khaṭīb and many others allowed it. Ibn al-Ṣalāḥ called all such forms a disliked leniency; Ibn Ḥajar adds that they are far weaker than hearing, yet still better than narrating the report muʿḍal (§5.58)."
  views:
    - id: ibn-hajar
      label: Ibn Ḥajar's ranking
      scholars: §5.55
      note: "Hearing the teacher's own words ranks first; reading to him comes second."
    - id: madinah
      label: Some scholars of Madīna
      scholars: §5.55
      note: "Mālik and other scholars of Madīna fiercely refuted those in Iraq who denied that reading to the teacher counts; some of them went as far as ranking reading to him above hearing him."
    - id: bukhari
      label: al-Bukhārī and many others
      scholars: §5.55
      note: "A large group, al-Bukhārī among them, hold that hearing the teacher and reading to him are equal in authenticity and strength."
  panels:
    - { id: steps-1-2, label: Steps 1–2, x0: 0, x1: 220 }
    - { id: steps-3-4, label: Steps 3–4, x0: 220, x1: 430 }
    - { id: steps-5-6, label: Steps 5–6, x0: 430, x1: 640 }
    - { id: steps-7-8, label: Steps 7–8, x0: 640, x1: 860 }
- id: heard
  division: siyagh-al-ada
  moons: [1]
  order: 2
  title: Did ʿan mean he heard it?
  eyebrow: A chain joined by ʿan · §5.55–5.56
  lede: The word ʿan says neither that a narrator heard the report nor that he did not. A chain joined by it counts as heard when the two in each link lived at the same time and the narrator is no concealer. Ibn Ḥajar's chosen view asks one thing more, that the two are known to have met, even once.
  source: §5.55 ʿAn and its likes, §5.56 Muʿanʿan
  diagram: Heard
  width: 1040
  captions:
    - term: muanan
      note: "A chain joined throughout by ʿan, a word that could mean he heard, had permission, or did not hear at all. Between two who lived at the same time it counts as heard; between two who did not, the report is mursal or munqaṭiʿ; from a concealer it does not count. Ibn Ḥajar's chosen view, with ʿAlī ibn al-Madīnī and al-Bukhārī, also asks for proof that they met, even once (§5.55–5.56)."
  views:
    - id: ibn-hajar
      label: "Ibn Ḥajar: they met at least once"
      scholars: §5.56; with ʿAlī ibn al-Madīnī, al-Bukhārī and others
      note: "Living at the same time is not enough: there must be evidence that the two met, even once, so that the chain is kept clear of a hidden mursal. Ibn Ḥajar calls this the chosen opinion."
    - id: contemporary
      label: Living at the same time is enough
      scholars: §5.56
      note: "The first condition alone: ʿan between two who lived at the same time counts as heard, unless the narrator is a concealer. No meeting has to be shown, so nothing rules out a hidden mursal."
  panels:
    - { id: chain, label: A chain of ʿan, x0: 0, x1: 260 }
    - { id: same-time, label: Lived at the same time?, x0: 260, x1: 520 }
    - { id: concealer, label: A concealer?, x0: 520, x1: 780 }
    - { id: met, label: "Met, even once?", x0: 780, x1: 1040 }
  extra:
    - title: The illustration
      section: §5.56
      note: "The book names no chain for this; the chain and the lifespans are an illustration of its three conditions."
- id: permission
  division: siyagh-al-ada
  moons: [2]
  order: 3
  title: Did he give permission?
  eyebrow: Permission, handing over and letters · §5.55
  lede: Most of the weaker ways of receiving count only if the teacher gives permission to narrate. Handing the student his book with that permission is its highest form. Without permission, most scholars do not count a book handed over, and Ibn Ḥajar sees little difference between that and a book sent. A letter is mukātaba, though earlier and later scholars use the word differently.
  source: §5.55 Mukātaba and munāwala, §5.57 Wijāda and waṣiyya, §5.58 Iʿlām and ijāza
  diagram: Permission
  width: 1040
  captions:
    - term: ijaza
      note: "A teacher's permission to narrate his reports. Given by word of mouth it is called mushāfaha, and in writing, in the later scholars' usage, mukātaba. Wijāda and iʿlām count only with it, and for most scholars waṣiyya and munāwala too. Even the specified kind is strongly disputed, though the later scholars accept it, and all agree it is below hearing (§5.55, §5.57–5.58)."
    - term: munawala
      note: "The teacher gives the student his original manuscript or one checked against it, or the student is shown the teacher's original, and the teacher tells him these are his narrations, to narrate from him. With that permission, and the copy left in the student's hands to work from, it is the highest ijāza, since it is specific and in person (§5.55)."
    - term: ijaza-muayyana
      note: "Specified permission: the teacher permits a particular book of his and says how it is to be narrated. A munāwala whose copy is taken straight back is no longer the highest ijāza, but still ranks above this. Its acceptance is strongly disputed, though the later scholars accept it, and all agree it is below hearing (§5.55, §5.58)."
    - term: mukataba
      note: "Correspondence. The later scholars use it for permission given in writing. The earlier scholars kept the word for a teacher writing out ḥadīth for his student, whether or not he also gave permission, and did not call a letter that carries permission alone mukātaba (§5.55)."
  views:
    - id: majority
      label: "Most scholars: not without permission"
      scholars: §5.55
      note: "Most scholars do not count a munāwala that comes with no permission. Ibn Ḥajar sees no strong difference between handing a book over and sending one from land to land when neither carries permission."
    - id: sending
      label: "Some imams: like a book sent"
      scholars: §5.55
      note: "Those who allow it compare it to sending a book from one land to another, and a group of the ḥadīth imams count a book sent even without permission, as if the sending itself were a sign of permission."
  panels:
    - { id: ijaza, label: Permission, x0: 0, x1: 260 }
    - { id: handing, label: Handing over, x0: 260, x1: 520 }
    - { id: no-permission, label: Without permission, x0: 520, x1: 780 }
    - { id: letters, label: By letter, x0: 780, x1: 1040 }
  extra:
    - title: The illustration
      section: §5.55
      note: "The book names no teacher or student for these forms; the figures are an illustration."
- id: licence
  division: siyagh-al-ada
  moons: [2]
  order: 4
  title: Whom may a permission name?
  eyebrow: The loose forms of permission · §5.58
  lede: A permission names a student and a book. Some teachers gave it far more loosely, to everyone, to someone unidentified, to someone not yet born, or on someone else's wish. Ibn Ḥajar counts none of these; al-Khaṭīb allowed all but the unidentified. Even at best they are far weaker than hearing, though better than a muʿḍal report.
  source: §5.58 Ijāza ʿāmma, li-l-majhūl, li-l-maʿdūm and muʿallaqa
  diagram: Licence
  width: 860
  captions:
    - term: ijaza-majhul
      note: "Permission that names someone who is not identified, or a book that is not identified. It does not count. al-Khaṭīb, who allowed the other loose forms and cited a group of his shaykhs for them, made an exception of this one (§5.58)."
    - term: ijaza-madum
      note: "Permission to someone not yet born, as in “whom shall soon be born”. Some say it is valid when joined to someone living, as in permission to you and whoever is born to you. Ibn Ḥajar: nearer the truth, it is not valid either. Abū Bakr ibn Abī Dāwūd and Abū ʿAbd Allāh ibn Manda used it (§5.58)."
    - term: ijaza-muallaqa
      note: "Permission that hangs on someone else's wish: to you if so-and-so wishes, or to whomever so-and-so wishes. It does not count, unlike permission to you if you wish. Abū Bakr ibn Abī Khaythama used it, and al-Khaṭīb allowed it, as he did the unborn and the general forms (§5.58)."
  views:
    - id: ibn-hajar
      label: "Ibn Ḥajar: none of them counts"
      scholars: §5.58
      note: "The correct opinion is that none of these forms counts: not the general ones, the unidentified, the unborn or the conditional. Of the general forms, permission to the people of one land comes nearest, being the most restricted."
    - id: khatib
      label: "al-Khaṭīb: all but the unidentified"
      scholars: §5.58; with a group of his shaykhs
      note: "al-Khaṭīb allowed every one of these forms except permission to someone or something unidentified, citing a group of his shaykhs for it. Many others allowed the general permission."
  extra:
    - title: The ranking
      section: §5.58
      note: "As Ibn al-Ṣalāḥ says, all these forms are a disliked leniency. Even specified permission is strongly disputed, though the later scholars accept it, and all agree it is below hearing, so these forms are much weaker still. Yet they are better than narrating the report muʿḍal. Many scholars allowed the general permission, so many that some ḥāfiẓs gathered them in a book in alphabetical order."
    - title: The illustrations
      section: §5.58
      note: "The book names no one who received these permissions; the cards and figures are illustrations of its formulas."
- id: names
  division: al-asma
  moons: [0, 1, 2]
  order: 1
  title: Who is who?
  eyebrow: Names that are shared or look alike · §5.59–5.61
  lede: Some narrators share one name; others have names written alike but read differently. Telling them apart keeps two men from being taken for one, and a name from being misread.
  source: §5.59 Muttafiq and muftariq, §5.60 Muʾtalif and mukhtalif, §5.61 Mutashābih
  diagram: Names
  width: 860
  captions:
    - term: muttafiq-wa-muftariq
      note: "Two or more narrators share their names and their fathers' names, and further back, or share a kunya and a nisba, yet they are different people. Knowing them guards against taking two people for one. It is the opposite of muhmal, where one person may be taken for two (§5.59)."
    - term: mutalif-wa-mukhtalif
      note: "Names written the same but read differently, whether by their dots or by their vowels. Ibn Ḥajar counts knowing them among the most important parts of the field: ʿAlī ibn al-Madīnī said most misreadings happen in names, and others explain why: a name cannot be worked out by analogy, and nothing before or after it in the text points to the right reading (§5.60)."
    - term: mutashabih
      note: "The names match in writing and sound, but the fathers' names, written alike, are read differently: Muḥammad ibn ʿAqīl al-Nīsābūrī and Muḥammad ibn ʿUqayl al-Firyābī, both famous and of one generation. Or the reverse: Shurayḥ ibn al-Nuʿmān, a Successor who reported from ʿAlī, and Surayj ibn al-Nuʿmān, a teacher of al-Bukhārī. A matching name with a differing nisba counts too (§5.61)."
  extra:
    - title: "Worked example: ʿAbd Allāh ibn Zayd"
      ar: عَبْدُ اللَّهِ بْنُ زَيْدٍ
      section: §5.61
      note: "Many narrators bear this name. Two are Companions, both of the Anṣār: one reported the hadith on the call to prayer (adhān), and his grandfather was ʿAbd Rabbih; the other reported the hadith on ablution (wuḍūʾ), and his grandfather was ʿĀṣim. ʿAbd Allāh ibn Yazīd, one letter more in the father's name, is a second crowd, among them the Companion al-Khaṭmī and al-Qārī, named in ʿĀʾisha's report. Close by are ʿAbd Allāh ibn Yaḥyā, ʿAbd Allāh ibn Nujayy (a Successor who reported from ʿAlī), and names in swapped order: Yazīd ibn ʿAbd Allāh against ʿAbd Allāh ibn Yazīd, al-Aswad ibn Yazīd against Yazīd ibn al-Aswad. In the diagram each name part added, ʿAbd Allāh, ibn Zayd, al-Anṣārī, then ibn ʿAbd Rabbih, narrows the list until only the Companion of the adhān is left."
- id: grades
  division: al-maqbul
  moons: [0]
  order: 1
  title: How sound is it?
  eyebrow: Accepted reports, the four grades · §5.9–5.10
  lede: Ibn Ḥajar sorts accepted reports into four grades by asking two questions. Are the qualities that make a report acceptable all present at their fullest? If not, does something outside the report make up the gap?
  source: §5.9 Ṣaḥīḥ, §5.10 Ḥasan
  diagram: Grades
  width: 860
  captions:
    - term: sahih-li-dhatihi
      note: "A report carried by upright narrators of complete accuracy, through a connected chain, with no anomaly (shādhdh) and no hidden defect (muʿallal). It is the first of the four accepted grades, where every quality of acceptance is present at its highest. Calling it sound in itself sets it apart from a report graded sound because of something outside it (§5.9)."
    - term: adl
      note: "Upright: a settled quality that holds the narrator to piety (taqwā) and decent conduct. Piety here means keeping away from evil deeds: associating partners with Allah, immorality and innovation. The word “upright” in the definition shuts out reports carried by narrators who are not upright (§5.9)."
    - term: dabt
      note: "Accuracy, of two kinds: of memory and of the book. The definition asks for complete accuracy, to mark the higher rank. When accuracy is a little lighter but every other condition holds, the report is fair in itself (ḥasan li-dhātihi) instead (§5.9, §5.10)."
    - term: dabt-sadr
      note: "Accuracy of memory: he keeps what he heard so firmly that he can bring it out whenever he wishes (§5.9)."
    - term: dabt-kitab
      note: "Accuracy of the book: he guards his written copy, keeping it safe where no one can alter it, from the time he heard it and checked it until he narrates from it (§5.9)."
    - term: ittisal
      note: "A connected chain is free of any drop: every man in it heard the report from the shaykh he names. A chain with a drop fails this condition; the kinds of drop are set out later, under rejected reports (§5.9, §5.17)."
    - term: asahh-al-asanid
      note: "Sound reports differ in rank with the strength of their narrators. At the top are chains some imams named the soundest: al-Zuhrī from Sālim from his father Ibn ʿUmar; Ibn Sīrīn from ʿUbayda from ʿAlī; al-Nakhaʿī from ʿAlqama from Ibn Masʿūd. Ibn Ḥajar's settled view is to crown no single chain, though those they named rank above the rest (§5.9)."
    - term: hasan-li-dhatihi
      note: "Every condition of the sound holds, but the narrator's accuracy is lighter. It is used as proof like the sound, though ranked below it, and it too has ranks. Ibn Ḥajar's examples of chains that are fair only: Muḥammad ibn Isḥāq from ʿĀṣim ibn ʿUmar from Jābir, and ʿAmr ibn Shuʿayb from his father from his grandfather (§5.9, §5.10)."
    - term: sahih-li-ghayrihi
      note: "Sound, but not in itself. The report's qualities fall short of the highest, and something makes up the shortfall, such as many routes. Ibn Ḥajar's case: a chain that is fair in itself is called sound when its routes multiply, because together they have a strength that makes up for its narrator's lighter accuracy (§5.9, §5.10)."
    - term: hasan-li-ghayrihi
      note: "Fair, but not in itself. A report that had been held back is raised to fair when an indication tips it towards acceptance. Ibn Ḥajar's example is the report of a mastūr, a narrator whose state is not known, once its routes multiply (§5.9, §5.10)."
    - term: hasan-sahih
      note: "al-Tirmidhī and others sometimes call one report “ḥasan ṣaḥīḥ”. With one route it records doubt: ḥasan to some, ṣaḥīḥ to others, as if “or” had been dropped, so it ranks below plain ṣaḥīḥ. With two routes it means one is ṣaḥīḥ and the other ḥasan, so it ranks above a ṣaḥīḥ with only one route, since more routes strengthen (§5.10)."
  views:
    - id: ibn-hajar
      label: Ibn Ḥajar
      scholars: §5.10
      note: "Fair in itself: every condition of the sound, with the narrator's accuracy a little lighter. It ranks below sound, and many routes raise it to sound."
    - id: tirmidhi
      label: al-Tirmidhī, in his book
      scholars: §5.10
      note: "al-Tirmidhī calls a report ḥasan when no narrator in it is accused of lying, it comes by more than one such route, and it is not anomalous. Ibn Ḥajar points out that he gave this definition for his own book (“according to us”), and only for the plain grade."
  extra:
    - title: Ḥasan in al-Tirmidhī's book
      section: §5.10
      note: "al-Tirmidhī defined ḥasan for his own book, and only for the plain grade: no narrator accused of lying, more than one such route, and not anomalous. He said “according to us”, so his “ḥasan gharīb” (“we do not know of it except by this path”) does not contradict that definition, which never covered the compound grades. He left those, like plain ṣaḥīḥ and gharīb, undefined, seemingly because the people of the field already knew them."
    - title: Ranks by the two Ṣaḥīḥs
      section: §5.9
      note: "Ibn Ḥajar ranks sound reports by where they are found: first what al-Bukhārī and Muslim both record; then what al-Bukhārī alone records; then what Muslim alone records; then what meets both their conditions; then what meets al-Bukhārī's condition; then what meets Muslim's. A seventh type meets neither. A stronger factor can override this order: a mashhūr report in Muslim that yields knowledge outranks one al-Bukhārī records alone, and a soundest chain such as Mālik from Nāfiʿ from Ibn ʿUmar, recorded by neither, outranks a report only one of them records, especially when that one's chain holds a narrator in doubt."
- id: opposition
  division: al-maqbul
  moons: [1]
  order: 2
  title: Who outweighs whom?
  eyebrow: Accepted reports, when narrators disagree · §5.10–5.12
  lede: One narrator may add words to a report, or tell it differently from others. An addition that clashes with nothing is accepted; when two versions clash, the weightier is kept. What the winner and the loser are called depends on whether the narrator who lost was reliable or weak.
  source: §5.10 Ziyādat al-thiqa, §5.11 Shādhdh and maḥfūẓ, §5.12 Maʿrūf and munkar
  diagram: Opposition
  width: 780
  captions:
    - term: ziyadat-al-thiqa
      note: "Extra words that a narrator of a sound or fair report gives and others leave out. If they clash with nothing, they are accepted, like a report a reliable narrator gives alone. If accepting them would mean rejecting the other version, the two are weighed: the weightier is accepted and the other rejected. None of the early masters is known to have accepted additions outright (§5.10)."
    - term: mahfuz
      note: "The weightier version, which wins. Ibn ʿUyayna gave the report of a man who died leaving no heir but a slave he had freed from ʿAmr ibn Dīnār, from ʿAwsaja, from Ibn ʿAbbās, and Ibn Jurayj and others gave it the same way. Ibn Abī Ḥātim judged Ibn ʿUyayna's version maḥfūẓ (§5.11)."
    - term: shadhdh
      note: "An acceptable narrator goes against one who is weightier: by firmer accuracy, by numbers, or on some other ground. Ḥammād ibn Zayd, accurate and trustworthy, gave the same report from ʿAmr ibn Dīnār, from ʿAwsaja, without Ibn ʿAbbās. His version lost because the other side had more narrators. Ibn Ḥajar calls this the settled sense of the term (§5.11)."
    - term: munkar
      note: "A weak narrator goes against a stronger one. Ḥubayyib ibn Ḥabīb, brother of Ḥamza al-Zayyāt, gave from Abū Isḥāq, from al-ʿAyzār ibn Ḥurayth, from Ibn ʿAbbās, as the Prophet's ﷺ words: whoever prays, gives zakāt, makes the ḥajj, fasts and honours his guest enters Paradise. Ibn Abī Ḥātim called it munkar (§5.12)."
    - term: maruf
      note: "The stronger version, which wins against a weak narrator. Reliable narrators gave the same report from Abū Isḥāq without carrying it up to the Prophet ﷺ, and Ibn Abī Ḥātim called theirs maʿrūf. Shādhdh and munkar share the opposition but differ in the narrator, reliable in one and weak in the other; Ibn Ḥajar calls treating them as one ignorance (§5.12)."
  views:
    - id: ibn-hajar
      label: Ibn Ḥajar and the early masters
      scholars: §5.10
      note: "Weigh an addition when it clashes. Examining additions is reported from ʿAbd al-Raḥmān ibn Mahdī, Yaḥyā al-Qaṭṭān, Aḥmad, Ibn Maʿīn, ʿAlī ibn al-Madīnī, al-Bukhārī, Abū Zurʿa al-Rāzī, al-Nasāʾī, al-Dāraquṭnī and others; none of them is known to have accepted it outright. al-Shāfiʿī's own words point the same way."
    - id: accept-all
      label: Accept every addition
      scholars: §5.10
      note: "A well-known opinion accepts a reliable narrator's addition outright, without weighing. Ibn Ḥajar finds it surprising from hadith scholars who make “not being shādhdh” a condition of the sound and the fair, and more surprising from some Shāfiʿīs who hold it, since al-Shāfiʿī said a longer version that goes against the memorisers can harm a report."
  panels:
    - id: added-words
      label: Added words
      x0: 0
      x1: 260
    - id: shadhdh
      label: Shādhdh · maḥfūẓ
      x0: 260
      x1: 520
    - id: munkar
      label: Munkar · maʿrūf
      x0: 520
      x1: 780
  extra:
    - title: The freed slave's report
      section: §5.11
      note: "The report in the shādhdh example: a man died in the Prophet's ﷺ time and left no heir but a slave he had freed. al-Tirmidhī, al-Nasāʾī and Ibn Māja recorded it through Ibn ʿUyayna, whose version names Ibn ʿAbbās; Ḥammād ibn Zayd's leaves him out."
    - title: The Paradise report
      section: §5.12
      note: "The report in the munkar example: whoever prays, gives zakāt, makes the ḥajj, fasts and honours his guest enters Paradise. Ḥubayyib ibn Ḥabīb carried it up to the Prophet ﷺ; the reliable narrators did not."
- id: support
  division: al-maqbul
  moons: [2]
  order: 3
  title: Does anyone else carry it?
  eyebrow: Accepted reports, corroboration · §5.13
  lede: A report thought to rest on one narrator may turn out to have company, either another route to the same Companion or a matching text from a different Companion. Searching the collections is how they are found.
  source: §5.13 Mutābiʿ, shāhid and iʿtibār
  diagram: Support
  width: 780
  captions:
    - term: itibar
      note: "Going through the chains in the collections, the jāmiʿs, musnads and juzʾs, to learn whether a report thought to be solitary has a follow-up. Ibn al-Ṣalāḥ's heading, “Knowing the iʿtibār, the mutābaʿāt and the shawāhid”, led some to take it for a kind beside the other two. It is not: it is the way both are found (§5.13)."
    - term: mutabi
      note: "A report first thought to be solitary, a relative gharīb (fard nisbī), turns out to have others agreeing with it; the agreeing route is a mutābiʿ, and its benefit is strength. Full or partial, it need not repeat the exact words, since the same meaning is enough, but it must come from the same Companion (§5.13)."
    - term: mutabaa-tamma
      note: "Full follow-up: the agreement is with the narrator himself. al-Shāfiʿī gave Mālik's report with “complete the period [of] thirty” in al-Umm, and a group took it for one of his gharīb reports, since Mālik's other students have “count for it”. But al-Qaʿnabī also gave it from Mālik, as al-Bukhārī records (§5.13)."
    - term: mutabaa-qasira
      note: "Partial follow-up: the agreement is with the narrator's teacher, or joins further along the chain. For the same report, Ibn Khuzayma's Ṣaḥīḥ has ʿĀṣim ibn Muḥammad, from his father Muḥammad ibn Zayd, from ʿAbd Allāh ibn ʿUmar: “complete thirty”. Muslim's Ṣaḥīḥ has ʿUbayd Allāh ibn ʿUmar, from Nāfiʿ, from Ibn ʿUmar: “count thirty” (§5.13)."
    - term: shahid
      note: "A text narrated from another Companion that resembles the report in wording and meaning, or in meaning alone. In wording: al-Nasāʾī's version through Muḥammad ibn Jubayr from Ibn ʿAbbās, like ʿAbd Allāh ibn Dīnār's from Ibn ʿUmar. In meaning: al-Bukhārī's through Muḥammad ibn Ziyād from Abū Hurayra, “complete the period of Shaʿbān thirty” (§5.13)."
  panels:
    - { id: lone, label: The lone route and a full follow-up, x0: 0, x1: 260 }
    - { id: partial, label: Partial follow-ups, x0: 260, x1: 520 }
    - { id: witness, label: Witnesses, x0: 520, x1: 780 }
  extra:
    - title: Sorting them by wording
      section: §5.13
      note: "A group of scholars draw the line differently: a report that matches in wording is a mutābiʿ, whether or not it comes from the same Companion, and one that matches in meaning is a shāhid. The two names are also sometimes used for each other. Ibn Ḥajar says the matter is easy. The diagram follows his own definitions, which sort the routes by Companion."
- id: acted-on
  division: al-maqbul
  moons: [3]
  order: 4
  title: Can both be acted on?
  eyebrow: Accepted reports, acted on or not · §5.14–5.16
  lede: An accepted report that nothing contradicts is acted on, and such reports are many. When two accepted reports seem to clash, Ibn Ḥajar works through a fixed order. First he tries to harmonise them, then he looks for abrogation, then he prefers one, and only then does he pause.
  source: §5.14 Muḥkam, §5.15 Mukhtalif al-ḥadīth, §5.16 Nāsikh and mansūkh
  diagram: ActedOn
  width: 1040
  captions:
    - term: muhkam
      note: "Accepted reports also divide into those acted on and those not. An accepted report that no other report contradicts is muḥkam, and its examples are many. If the report opposing it is a rejected one, the opposition has no effect, since a weak report cannot unsettle a strong one (§5.14)."
    - term: mukhtalif-al-hadith
      note: "Two accepted reports of equal standing seem to clash, but their meanings can be harmonised without strain. Ibn al-Ṣalāḥ's example, both sound: “There is no contagion or evil fortune” and “Flee from a leper as you would from a lion”. Ibn Ḥajar's best harmony keeps the denial general, since the Prophet ﷺ asked who infected the first; the order to flee keeps a person from thinking contact made him ill (§5.15)."
    - term: naskh
      note: "If harmony fails and the date is known, the later report abrogates the earlier. Naskh is the lifting of a ruling of the Law by a later proof of the Law. A report from a Companion who became Muslim late does not abrogate an earlier one on that ground alone, unless he heard it from the Prophet ﷺ himself and narrated nothing from him before his Islām. Consensus does not abrogate; it only points to abrogation (§5.16)."
    - term: mansukh
      note: "The abrogated report: the earlier one, whose ruling was lifted. A Companion may say which came last. Jābir said that the last of the two commands from the Messenger ﷺ was to leave off ablution for what fire has touched, as the compilers of the Sunan record; so the earlier command, to make ablution for it, is the abrogated one. Many cases are known from the dates (§5.16)."
    - term: nasikh
      note: "The abrogating report: the one that shows the earlier ruling was lifted. The name is a figure of speech, since the one who truly abrogates is Allah. It is known most clearly from the text itself, as in Burayda's report in Ṣaḥīḥ Muslim: “I had forbidden you to visit graves. Visit them; for indeed it reminds of the hereafter.” It is also known from a Companion's word, or from the dates (§5.16)."
    - term: tarjih
      note: "If harmony fails and the date is unknown, one report may be preferred over the other by one of the many means of preference found in its text or its chain. If a preference can be made, the preferred report is singled out. This is what sorting accepted reports into kinds is for: preference when they conflict (§5.13, §5.16)."
    - term: tawaqquf
      note: "If no preference can be made, the two are paused upon: neither is acted on for now. Calling them paused is better than calling them dropped, because the failure to prefer one is only the researcher's, at that moment; what is hidden from him may become clear to someone else (§5.16)."
  panels:
    - id: steps-1-2
      label: Steps 1–2
      x0: 0
      x1: 260
    - id: step-3
      label: Step 3
      x0: 260
      x1: 520
    - id: step-4
      label: Step 4
      x0: 520
      x1: 780
    - id: step-5
      label: Step 5
      x0: 780
      x1: 1040
  extra:
    - title: The contagion reports
      section: §5.15
      note: "Ibn al-Ṣalāḥ harmonised the pair this way: illnesses do not infect by their nature, but Allah has made mixing with the ill a cause of a healthy person falling ill, which sometimes does not happen, as with other causes. Ibn Ḥajar prefers to keep the Prophet's ﷺ denial general. When someone said that a sick camel mixes with healthy camels and they fall ill, the Prophet ﷺ asked, “Then who infected the first?”: Allah began the illness in the second as He did in the first. The order to flee from the leper closes the way to a wrong belief, so that someone who mixes with the ill and falls ill does not think contagion caused it. al-Shāfiʿī wrote a book on this type, Ikhtilāf al-ḥadīth, and Ibn Qutayba, al-Ṭaḥāwī and others wrote after him."

# Muntahā al-isnād (phase 3 design docs/superpowers/specs/2026-10-29-phase-3-muntaha-design.md)
- id: ends
  division: muntaha-al-isnad
  moons: [0, 1, 2]
  order: 1
  title: Where does the chain end?
  eyebrow: Where the chain ends, and the names it gives · §5.40–5.43
  lede: A chain leads to the words of a report, and the report is named by whose words they are. If they are the Prophet's ﷺ, it is raised; if a Companion's, stopped; if a Successor's or someone later's, cut off. The names say where the words stop, not whether the chain is whole.
  source: §5.40 Marfūʿ, §5.41 Mawqūf, §5.42 Maqṭūʿ, §5.43 The names, and athar
  diagram: Ends
  width: 780
  captions:
    - term: marfu
      note: "A report whose chain ends at the Prophet ﷺ: his sayings, his acts or his silent approval, whether the wording says so outright or only implies it. It is marfūʿ whether its chain is connected or not, and whether the Companion heard it from him or through someone. The isnād is the path to the matn, and the matn the words where it ends (§5.40, §5.43)."
    - term: mawquf
      note: "A report whose chain ends at a Companion: his own sayings, acts or silent approval, known from the wording much as for the Prophet ﷺ, though not every form carries over. Said bare, mawqūf means stopped at a Companion; for someone later one may say it is mawqūf on him, naming him (§5.41, §5.43)."
    - term: maqtu
      note: "A report whose chain ends at a Successor, or at someone after him, such as the Followers of the Successors and those later still; the name is the same for all of them. It describes the matn, where the words stop. Munqaṭiʿ describes the isnād, a break in it; some scholars used one for the other, against correct usage (§5.43)."
    - term: athar
      note: "The last two kinds, the mawqūf and the maqṭūʿ, share a further name: athar. A report stopped at a Companion and one cut off at a Successor or later are both called athar (§5.43)."
  panels:
    - id: raised
      label: Raised
      x0: 0
      x1: 260
    - id: stopped
      label: Stopped and cut off
      x0: 260
      x1: 780
- id: raised
  division: muntaha-al-isnad
  moons: [0]
  order: 2
  title: Is it from the Prophet ﷺ?
  eyebrow: Raised to the Prophet ﷺ, outright or by implication · §5.40
  lede: A report is raised when its words are from the Prophet ﷺ, his sayings, acts or approval. The Companion may say so outright, or say something that can only have come from him. Ibn Ḥajar gives the forms that count, and answers those who doubt some of them.
  source: §5.40 Marfūʿ, outright and implied
  diagram: Raised
  width: 860
  captions:
    - term: marfu-hukmi
      note: "A Companion who does not take from the biblical reports says what reasoning can't reach and no word's meaning explains: past events like creation and the prophets, future ones like the trials and the Day of Judgement, or a deed's set reward or punishment. Someone must have told him, and only the Prophet ﷺ could have, so it counts as if he said “the Messenger of Allah ﷺ said” (§5.40)."
  views:
    - id: most
      label: "Ibn Ḥajar and most: raised"
      scholars: §5.40; Ibn ʿAbd al-Barr reports a consensus
      note: "When a Companion says “from the sunna is…”, or “we were ordered” or “prohibited”, it counts as raised. The sunna meant is the Prophet's ﷺ, as Sālim told Ibn Shihāb; one under a leader who says “I have been ordered” means by the leader. Ibn Ḥajar calls the claim of consensus contentious, since al-Shāfiʿī has two opinions."
    - id: not-raised
      label: "Some: not raised"
      scholars: "Abū Bakr al-Ṣayrafī, Abū Bakr al-Rāzī, Ibn Ḥazm; a group, on “we were ordered”, §5.40"
      note: "Sunna is said of others besides the Prophet ﷺ, so “from the sunna” need not mean his; an order could be the Qurʾan's, the consensus's, a caliph's or a derived ruling's. Ibn Ḥajar answers that these readings are far-fetched, or only possibilities, and the Companions were sure before they spoke."
  extra:
    - title: The book's examples
      section: §5.40
      note: "Outright: the Companion says he heard the Messenger of Allah ﷺ say something, saw him do it, or did it in his presence without objection. Implied, of an act: al-Shāfiʿī on ʿAlī's eclipse prayer with more than one bowing in each unit, which he could not have reached by his own thinking. Implied, of approval: the Companions say they used to do something in his time; Jābir and Abū Saʿīd argued that a practice was allowed because they did it while the Qurʾan was being revealed, and it would have forbidden it. Of a ruling: ʿAmmār called fasting the day of doubt disobedience to Abū al-Qāsim ﷺ."
    - title: Words that point to him
      section: §5.40
      note: "A Successor may say of a Companion that he raises the ḥadīth, narrates it, ascribes it or makes it reach the Prophet ﷺ (yarfaʿ, yarwī, yanmī, riwāya, yablughu bih, rawā). Sometimes the speaker is left out altogether, as in Ibn Sīrīn's reports from Abū Hurayra; al-Khaṭīb suggests this was the usage of Baṣra. Why not name him? From piety and caution: Abū Qilāba said he could have said that Anas raised his report, but it is better to keep the Companion's own words."
- id: companions
  division: muntaha-al-isnad
  moons: [1, 2]
  order: 3
  title: Who met whom?
  eyebrow: The Companion, the Successor and those between · §5.41–5.42
  lede: A chain may stop at a Companion or a Successor, so Ibn Ḥajar defines both. A Companion met the Prophet ﷺ believing in him and died a Muslim; a Successor met a Companion in the same way. Those who lived before Islam and into it without seeing him are counted with the senior Successors.
  source: §5.41 The Companions, §5.42 The Successors and the mukhaḍramūn
  diagram: Companions
  width: 1040
  captions:
    - term: sahabi
      note: "One who met the Prophet ﷺ believing in him and died a Muslim, even if he left Islam in between, on the most correct opinion. Meeting is wider than sitting or walking with him, even without words; Ibn Ḥajar says met, not saw, so blind Companions like Ibn Umm Maktūm count. Rank differs with length of company, but all share the honour (§5.41)."
    - term: tabii
      note: "One who met a Companion on the same terms: believing in the Prophet ﷺ and dying a Muslim. Only faith in the Companion is not asked, since that belongs to the Prophet ﷺ alone. This is the chosen opinion, against those who add long company with the Companion, a sound hearing from him, or a further condition (§5.42)."
    - term: mukhadram
      note: "Those who lived before Islam and into it but never saw the Prophet ﷺ. Whether they are Companions or Successors is disputed. Ibn ʿAbd al-Barr seemed to count them as Companions, but said he listed them to cover the whole first generation. The correct opinion makes them the senior Successors, whether or not one became Muslim in his lifetime, like al-Najāshī (§5.42)."
  views:
    - id: ibn-hajar
      label: "Ibn Ḥajar: senior Successors"
      scholars: §5.42, the correct opinion
      note: "The mukhaḍramūn are the senior Successors, whether or not one of them is known to have become Muslim in the Prophet's ﷺ lifetime, like al-Najāshī."
    - id: among-companions
      label: "Some: among the Companions"
      scholars: ʿIyāḍ and others, of Ibn ʿAbd al-Barr, §5.42
      note: "Ibn ʿAbd al-Barr seemed to place them among the Companions, and ʿIyāḍ and others said he did so outright. Ibn Ḥajar doubts it: Ibn ʿAbd al-Barr said in his introduction that he named them to cover all who lived in the first generation."
  panels:
    - id: companion
      label: The Companion
      x0: 0
      x1: 260
    - id: known
      label: How it is known
      x0: 260
      x1: 520
    - id: successor
      label: The Successor
      x0: 520
      x1: 780
    - id: mukhadram
      label: Between two eras
      x0: 780
      x1: 1040
  extra:
    - title: The definition, part by part
      section: §5.41
      note: "Meeting is the genus. Believing leaves out those who met him as disbelievers; in him, those who believed only in an earlier prophet; died a Muslim, those who left Islam after meeting him and died so, like Ibn Khaṭal. Whether one who met him believing before his mission, knowing he would be sent, and died before it, counts is disputed. al-Ashʿath ibn Qays left Islam, was brought to Abū Bakr a prisoner, returned to Islam and married his sister; no one denied him Companionship or left his ḥadīth out of the musnads."
    - title: How Companionship is known
      section: §5.41
      note: "By mutawātir report, by its being widely known, by another Companion or a reliable Successor saying so, or by his own claim when it is plausible; a group of ḥadīth scholars hesitate over the last, since it is like a man saying “I am credible”."
    - title: Two notes
      section: §5.41
      note: "One who kept long company with him, fought beside him or died under his command ranks above one who met him briefly or saw him as a child, though all share the honour. A Companion who did not hear from him narrates mursal, though he is a Companion."
    - title: The Night of Ascension
      section: §5.42
      note: "If it were proven that all the people of the earth were shown to him on that night, the mukhaḍramūn would count among those who believed in him in his lifetime, since he saw them."
- id: connected
  division: muntaha-al-isnad
  moons: [3]
  order: 4
  title: Does it look connected?
  eyebrow: The musnad report · §5.44
  lede: When a ḥadīth master calls a report musnad, he means a Companion raised it to the Prophet ﷺ through a chain that looks connected. A hidden gap doesn't stop it being musnad; a gap that shows, or a chain that stops short of him, does. Two other scholars used the word differently.
  source: §5.44 Musnad
  diagram: Connected
  width: 860
  captions:
    - term: musnad
      note: "As a ḥadīth master says “a musnad ḥadīth”: a report a Companion raises to the Prophet ﷺ by a chain that looks connected. One a Successor raises is mursal; one raised from below him, muʿḍal or muʿallaq. A hidden break, like a mudallis's ʿan or a contemporary not known to have met, doesn't undo it: the imams compiled musnads of such chains. al-Ḥākim agrees (§5.44)."
  views:
    - id: ibn-hajar
      label: "Ibn Ḥajar: raised, and looks connected"
      scholars: §5.44; with al-Ḥākim
      note: "A musnad is raised by a Companion to the Prophet ﷺ through a chain that looks connected. A report connected only as far as a Companion is not musnad, and nor is a raised report whose gap shows."
    - id: khatib
      label: "al-Khaṭīb: connected"
      scholars: al-Khaṭīb al-Baghdādī, §5.44
      note: "Musnad means connected. So a mawqūf with a connected chain is musnad too, though al-Khaṭīb says the usage is rare."
    - id: ibn-abd-al-barr
      label: "Ibn ʿAbd al-Barr: raised"
      scholars: Ibn ʿAbd al-Barr, §5.44
      note: "Musnad means marfūʿ, whether or not the chain is connected, so the mursal, the muʿḍal and the munqaṭiʿ would be musnad when their text is raised. Ibn Ḥajar calls this far-fetched, and says no one else holds it."
  panels:
    - id: looks-connected
      label: Looks connected
      x0: 0
      x1: 344
    - id: gap-shows
      label: A gap shows
      x0: 344
      x1: 688
    - id: stops
      label: Stops at a Companion
      x0: 688
      x1: 860
- id: generations
  division: marifat-al-ruwat
  moons: [0]
  order: 1
  title: When and where did he live?
  eyebrow: Knowing the narrators, generations, dates and homelands · §5.62
  lede: A ḥadīth master needs to know which generation each narrator belongs to, when he was born and died, and where he lived. These keep two men from being confused, expose a false claim to have met someone, and help uncover a concealed drop.
  source: §5.62 Ṭabaqa, al-mawālīd wa-l-wafayāt, al-buldān wa-l-awṭān
  diagram: Generations
  width: 780
  captions:
    - term: tabaqa
      note: "A group of narrators alike in age and in the shaykhs they met. Knowing it guards against confusion, helps expose tadlīs, and shows what an ʿanʿana really means. One man may belong to two: Anas ibn Mālik is counted by his companionship in the generation of the Ten, and by his youth in the one after. Ibn Saʿd's book is the most comprehensive (§5.62)."
    - term: mawalid-wa-wafayat
      note: "Narrators' dates of birth and death. With them the truth comes out when someone claims to have met a man he never met (§5.62)."
    - term: awtan
      note: "Narrators' towns and lands. Knowing them keeps apart two similar names whose bearers differ in where they belong (§5.62)."
