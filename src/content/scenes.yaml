- id: names
  division: al-asma
  moons: [0, 1, 2]
  order: 1
  title: Who is who?
  eyebrow: Names that are shared or look alike · §5.59–5.61
  lede: Some narrators share one name; others have names written alike but read differently. Telling them apart keeps two men from being taken for one, and a name from being misread.
  source: §5.59 Muttafiq and muftariq, §5.60 Muʾtalif and mukhtalif, §5.61 Mutashābih
  diagram: Names
  width: 860
  captions:
    - term: muttafiq-wa-muftariq
      note: "Two or more narrators share their names and their fathers' names, and further back, or share a kunya and a nisba, yet they are different people. Knowing them guards against taking two people for one. It is the opposite of muhmal, where one person may be taken for two (§5.59)."
    - term: mutalif-wa-mukhtalif
      note: "Names written the same but read differently, whether by their dots or by their vowels. Ibn Ḥajar counts knowing them among the most important parts of the field: ʿAlī ibn al-Madīnī said most misreadings happen in names, and others explain why: a name cannot be worked out by analogy, and nothing before or after it in the text points to the right reading (§5.60)."
    - term: mutashabih
      note: "The names match in writing and sound, but the fathers' names, written alike, are read differently: Muḥammad ibn ʿAqīl al-Nīsābūrī and Muḥammad ibn ʿUqayl al-Firyābī, both famous and of one generation. Or the reverse: Shurayḥ ibn al-Nuʿmān, a Successor who reported from ʿAlī, and Surayj ibn al-Nuʿmān, a teacher of al-Bukhārī. A matching name with a differing nisba counts too (§5.61)."
  extra:
    - title: "Worked example: ʿAbd Allāh ibn Zayd"
      ar: عَبْدُ اللَّهِ بْنُ زَيْدٍ
      section: §5.61
      note: "Many narrators bear this name. Two are Companions, both of the Anṣār: one reported the hadith on the call to prayer (adhān), and his grandfather was ʿAbd Rabbih; the other reported the hadith on ablution (wuḍūʾ), and his grandfather was ʿĀṣim. ʿAbd Allāh ibn Yazīd, one letter more in the father's name, is a second crowd, among them the Companion al-Khaṭmī and al-Qārī, named in ʿĀʾisha's report. Close by are ʿAbd Allāh ibn Yaḥyā, ʿAbd Allāh ibn Nujayy (a Successor who reported from ʿAlī), and names in swapped order: Yazīd ibn ʿAbd Allāh against ʿAbd Allāh ibn Yazīd, al-Aswad ibn Yazīd against Yazīd ibn al-Aswad. In the diagram each name part added, ʿAbd Allāh, ibn Zayd, al-Anṣārī, then ibn ʿAbd Rabbih, narrows the list until only the Companion of the adhān is left."
- id: grades
  division: al-maqbul
  moons: [0]
  order: 1
  title: How sound is it?
  eyebrow: Accepted reports, the four grades · §5.9–5.10
  lede: Ibn Ḥajar sorts accepted reports into four grades by asking two questions. Are the qualities that make a report acceptable all present at their fullest? If not, does something outside the report make up the gap?
  source: §5.9 Ṣaḥīḥ, §5.10 Ḥasan
  diagram: Grades
  width: 860
  captions:
    - term: sahih-li-dhatihi
      note: "A report carried by upright narrators of complete accuracy, through a connected chain, with no anomaly (shādhdh) and no hidden defect (muʿallal). It is the first of the four accepted grades, where every quality of acceptance is present at its highest. Calling it sound in itself sets it apart from a report graded sound because of something outside it (§5.9)."
    - term: adl
      note: "Upright: a settled quality that holds the narrator to piety (taqwā) and decent conduct. Piety here means keeping away from evil deeds: associating partners with Allah, immorality and innovation. The word “upright” in the definition shuts out reports carried by narrators who are not upright (§5.9)."
    - term: dabt
      note: "Accuracy, of two kinds: of memory and of the book. The definition asks for complete accuracy, to mark the higher rank. When accuracy is a little lighter but every other condition holds, the report is fair in itself (ḥasan li-dhātihi) instead (§5.9, §5.10)."
    - term: dabt-sadr
      note: "Accuracy of memory: he keeps what he heard so firmly that he can bring it out whenever he wishes (§5.9)."
    - term: dabt-kitab
      note: "Accuracy of the book: he guards his written copy, keeping it safe where no one can alter it, from the time he heard it and checked it until he narrates from it (§5.9)."
    - term: ittisal
      note: "A connected chain is free of any drop: every man in it heard the report from the shaykh he names. A chain with a drop fails this condition; the kinds of drop are set out later, under rejected reports (§5.9, §5.17)."
    - term: asahh-al-asanid
      note: "Sound reports differ in rank with the strength of their narrators. At the top are chains some imams named the soundest: al-Zuhrī from Sālim from his father Ibn ʿUmar; Ibn Sīrīn from ʿUbayda from ʿAlī; al-Nakhaʿī from ʿAlqama from Ibn Masʿūd. Ibn Ḥajar's settled view is to crown no single chain, though those they named rank above the rest (§5.9)."
    - term: hasan-li-dhatihi
      note: "Every condition of the sound holds, but the narrator's accuracy is lighter. It is used as proof like the sound, though ranked below it, and it too has ranks. Ibn Ḥajar's examples of chains that are fair only: Muḥammad ibn Isḥāq from ʿĀṣim ibn ʿUmar from Jābir, and ʿAmr ibn Shuʿayb from his father from his grandfather (§5.9, §5.10)."
    - term: sahih-li-ghayrihi
      note: "Sound, but not in itself. The report's qualities fall short of the highest, and something makes up the shortfall, such as many routes. Ibn Ḥajar's case: a chain that is fair in itself is called sound when its routes multiply, because together they have a strength that makes up for its narrator's lighter accuracy (§5.9, §5.10)."
    - term: hasan-li-ghayrihi
      note: "Fair, but not in itself. A report that had been held back is raised to fair when an indication tips it towards acceptance. Ibn Ḥajar's example is the report of a mastūr, a narrator whose state is not known, once its routes multiply (§5.9, §5.10)."
    - term: hasan-sahih
      note: "al-Tirmidhī and others sometimes call one report “ḥasan ṣaḥīḥ”. With one route it records doubt: ḥasan to some, ṣaḥīḥ to others, as if “or” had been dropped, so it ranks below plain ṣaḥīḥ. With two routes it means one is ṣaḥīḥ and the other ḥasan, so it ranks above a ṣaḥīḥ with only one route, since more routes strengthen (§5.10)."
  views:
    - id: ibn-hajar
      label: Ibn Ḥajar
      scholars: §5.10
      note: "Fair in itself: every condition of the sound, with the narrator's accuracy a little lighter. It ranks below sound, and many routes raise it to sound."
    - id: tirmidhi
      label: al-Tirmidhī, in his book
      scholars: §5.10
      note: "al-Tirmidhī calls a report ḥasan when no narrator in it is accused of lying, it comes by more than one such route, and it is not anomalous. Ibn Ḥajar points out that he gave this definition for his own book (“according to us”), and only for the plain grade."
  extra:
    - title: Ḥasan in al-Tirmidhī's book
      section: §5.10
      note: "al-Tirmidhī defined ḥasan for his own book, and only for the plain grade: no narrator accused of lying, more than one such route, and not anomalous. He said “according to us”, so his “ḥasan gharīb” (“we do not know of it except by this path”) does not contradict that definition, which never covered the compound grades. He left those, like plain ṣaḥīḥ and gharīb, undefined, seemingly because the people of the field already knew them."
    - title: Ranks by the two Ṣaḥīḥs
      section: §5.9
      note: "Ibn Ḥajar ranks sound reports by where they are found: first what al-Bukhārī and Muslim both record; then what al-Bukhārī alone records; then what Muslim alone records; then what meets both their conditions; then what meets al-Bukhārī's condition; then what meets Muslim's. A seventh type meets neither. A stronger factor can override this order: a mashhūr report in Muslim that yields knowledge outranks one al-Bukhārī records alone, and a soundest chain such as Mālik from Nāfiʿ from Ibn ʿUmar, recorded by neither, outranks a report only one of them records, especially when that one's chain holds a narrator in doubt."
- id: opposition
  division: al-maqbul
  moons: [1]
  order: 2
  title: Who outweighs whom?
  eyebrow: Accepted reports, when narrators disagree · §5.10–5.12
  lede: One narrator may add words to a report, or tell it differently from others. An addition that clashes with nothing is accepted; when two versions clash, the weightier is kept. What the winner and the loser are called depends on whether the narrator who lost was reliable or weak.
  source: §5.10 Ziyādat al-thiqa, §5.11 Shādhdh and maḥfūẓ, §5.12 Maʿrūf and munkar
  diagram: Opposition
  width: 780
  captions:
    - term: ziyadat-al-thiqa
      note: "Extra words that a narrator of a sound or fair report gives and others leave out. If they clash with nothing, they are accepted, like a report a reliable narrator gives alone. If accepting them would mean rejecting the other version, the two are weighed: the weightier is accepted and the other rejected. None of the early masters is known to have accepted additions outright (§5.10)."
    - term: mahfuz
      note: "The weightier version, which wins. Ibn ʿUyayna gave the report of a man who died leaving no heir but a slave he had freed from ʿAmr ibn Dīnār, from ʿAwsaja, from Ibn ʿAbbās, and Ibn Jurayj and others gave it the same way. Ibn Abī Ḥātim judged Ibn ʿUyayna's version maḥfūẓ (§5.11)."
    - term: shadhdh
      note: "An acceptable narrator goes against one who is weightier: by firmer accuracy, by numbers, or on some other ground. Ḥammād ibn Zayd, accurate and trustworthy, gave the same report from ʿAmr ibn Dīnār, from ʿAwsaja, without Ibn ʿAbbās. His version lost because the other side had more narrators. Ibn Ḥajar calls this the settled sense of the term (§5.11)."
    - term: munkar
      note: "A weak narrator goes against a stronger one. Ḥubayyib ibn Ḥabīb, brother of Ḥamza al-Zayyāt, gave from Abū Isḥāq, from al-ʿAyzār ibn Ḥurayth, from Ibn ʿAbbās, as the Prophet's ﷺ words: whoever prays, gives zakāt, makes the ḥajj, fasts and honours his guest enters Paradise. Ibn Abī Ḥātim called it munkar (§5.12)."
    - term: maruf
      note: "The stronger version, which wins against a weak narrator. Reliable narrators gave the same report from Abū Isḥāq without carrying it up to the Prophet ﷺ, and Ibn Abī Ḥātim called theirs maʿrūf. Shādhdh and munkar share the opposition but differ in the narrator, reliable in one and weak in the other; Ibn Ḥajar calls treating them as one ignorance (§5.12)."
  views:
    - id: ibn-hajar
      label: Ibn Ḥajar and the early masters
      scholars: §5.10
      note: "Weigh an addition when it clashes. Examining additions is reported from ʿAbd al-Raḥmān ibn Mahdī, Yaḥyā al-Qaṭṭān, Aḥmad, Ibn Maʿīn, ʿAlī ibn al-Madīnī, al-Bukhārī, Abū Zurʿa al-Rāzī, al-Nasāʾī, al-Dāraquṭnī and others; none of them is known to have accepted it outright. al-Shāfiʿī's own words point the same way."
    - id: accept-all
      label: Accept every addition
      scholars: §5.10
      note: "A well-known opinion accepts a reliable narrator's addition outright, without weighing. Ibn Ḥajar finds it surprising from hadith scholars who make “not being shādhdh” a condition of the sound and the fair, and more surprising from some Shāfiʿīs who hold it, since al-Shāfiʿī said a longer version that goes against the memorisers can harm a report."
  panels:
    - id: added-words
      label: Added words
      x0: 0
      x1: 260
    - id: shadhdh
      label: Shādhdh · maḥfūẓ
      x0: 260
      x1: 520
    - id: munkar
      label: Munkar · maʿrūf
      x0: 520
      x1: 780
  extra:
    - title: The freed slave's report
      section: §5.11
      note: "The report in the shādhdh example: a man died in the Prophet's ﷺ time and left no heir but a slave he had freed. al-Tirmidhī, al-Nasāʾī and Ibn Māja recorded it through Ibn ʿUyayna, whose version names Ibn ʿAbbās; Ḥammād ibn Zayd's leaves him out."
    - title: The Paradise report
      section: §5.12
      note: "The report in the munkar example: whoever prays, gives zakāt, makes the ḥajj, fasts and honours his guest enters Paradise. Ḥubayyib ibn Ḥabīb carried it up to the Prophet ﷺ; the reliable narrators did not."
- id: support
  division: al-maqbul
  moons: [2]
  order: 3
  title: Does anyone else carry it?
  eyebrow: Accepted reports, corroboration · §5.13
  lede: A report thought to rest on one narrator may turn out to have company, either another route to the same Companion or a matching text from a different Companion. Searching the collections is how they are found.
  source: §5.13 Mutābiʿ, shāhid and iʿtibār
  diagram: Support
  width: 780
  captions:
    - term: itibar
      note: "Going through the chains in the collections, the jāmiʿs, musnads and juzʾs, to learn whether a report thought to be solitary has a follow-up. Ibn al-Ṣalāḥ's heading, “Knowing the iʿtibār, the mutābaʿāt and the shawāhid”, led some to take it for a kind beside the other two. It is not: it is the way both are found (§5.13)."
    - term: mutabi
      note: "A report first thought to be solitary, a relative gharīb (fard nisbī), turns out to have others agreeing with it; the agreeing route is a mutābiʿ, and its benefit is strength. Full or partial, it need not repeat the exact words, since the same meaning is enough, but it must come from the same Companion (§5.13)."
    - term: mutabaa-tamma
      note: "Full follow-up: the agreement is with the narrator himself. al-Shāfiʿī gave Mālik's report with “complete the period [of] thirty” in al-Umm, and a group took it for one of his gharīb reports, since Mālik's other students have “count for it”. But al-Qaʿnabī also gave it from Mālik, as al-Bukhārī records (§5.13)."
    - term: mutabaa-qasira
      note: "Partial follow-up: the agreement is with the narrator's teacher, or joins further along the chain. For the same report, Ibn Khuzayma's Ṣaḥīḥ has ʿĀṣim ibn Muḥammad, from his father Muḥammad ibn Zayd, from ʿAbd Allāh ibn ʿUmar: “complete thirty”. Muslim's Ṣaḥīḥ has ʿUbayd Allāh ibn ʿUmar, from Nāfiʿ, from Ibn ʿUmar: “count thirty” (§5.13)."
    - term: shahid
      note: "A text narrated from another Companion that resembles the report in wording and meaning, or in meaning alone. In wording: al-Nasāʾī's version through Muḥammad ibn Jubayr from Ibn ʿAbbās, like ʿAbd Allāh ibn Dīnār's from Ibn ʿUmar. In meaning: al-Bukhārī's through Muḥammad ibn Ziyād from Abū Hurayra, “complete the period of Shaʿbān thirty” (§5.13)."
