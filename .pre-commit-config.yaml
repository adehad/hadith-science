---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: check-yaml
        files: .*\.(yaml|yml)$
      - id: check-added-large-files
        exclude: ^docs/screenshots/
      # the README's animated PNGs may be up to 1.5 MB each
      - id: check-added-large-files
        files: ^docs/screenshots/
        args: [--maxkb=1536]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        types_or: [text, json, markdown]
        args: ["--ignore-words", ".codespell-ignore"]
        exclude: ^(bun\.lock|docs/concept/.*)$
  - repo: https://github.com/adehad/pre-commit-hooks
    rev: b581e6c14a9fbd9c6d37452761b525be6737b97b
    hooks:
      - id: arabic-presentation-form
        entry: arabic-presentation-form
        language: python
        types_or: [text, json, markdown]
        args: [--excluded-chars, (ﷺ)]
        files: ^(src/|docs/)
  - repo: local
    hooks:
      # copyrighted source material must never be committed (spec §2)
      - id: guard-source
        name: guard copyrighted source
        entry: bun scripts/guard-source.mjs
        language: system
        pass_filenames: false
        always_run: true
      - id: unit-tests
        name: unit tests
        entry: bun --bun vitest run --project unit
        language: system
        pass_filenames: false
        files: ^(src/(lib|styles|components)/|tests/unit/|vitest\.config\.ts$)
